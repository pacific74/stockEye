name: stockeye
description: StockEye - 국내 주식 종목 선정 앱
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  intl: any
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.0
  open_filex: ^4.7.0      # 받은 APK 로 안드로이드 설치 화면 열기
  path_provider: ^2.1.4   # APK 를 받아 둘 앱 임시 폴더
  flutter_tts: ^4.2.0     # 당일매매 음성 안내 ("매수발생" 여성 · "매도발생" 남성)
  shared_preferences: ^2.3.2  # 음성 안내 켜기/끄기 (이 기기에만)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# shared_preferences_android 2.5.0 (2026-10-19 전후) 이 내부를 'Pigeon JNI' 로 바꿔서 안드로이드 릴리스 앱이 시작 때
#   NoSuchMethodError(SharedPreferencesApiRegistrar.getAll) 로 멈춤 → JNI 이전 마지막대의 안정 버전으로 고정 (2026-10-22)
#   다시 올릴 때는 새 버전을 직접 설치해 보고 올릴 것
dependency_overrides:
  shared_preferences_android: 2.4.23

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo_256.png

# 앱 실행 아이콘 생성:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  image_path_android: "assets/icon/icon_rounded.png"     # 구형 안드로이드
  adaptive_icon_background: "#050B1C"                   # 안드로이드 8+ (원/둥근사각 마스크)
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: false                                            # iOS 빌드할 때 true 로 (image_path_ios: assets/icon/icon_full.png)
  image_path: "assets/icon/icon_rounded.png"
  windows:
    generate: true
    image_path: "assets/icon/icon_rounded.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/icon/icon_rounded.png"
    background_color: "#050B1C"
    theme_color: "#12B5D9"
