# 종가배팅 종목찾기 (한 번) → 앱 메인·'관심 > 종가배팅'  — PC 꺼져 있어도 됨
#   ① 앱 [종목찾기] 버튼(관리자) → Supabase 가 바로 신호(repository_dispatch closingbet_request)
#   ② 여기 Actions → Run workflow
#   python -m scripts.closingbet --cloud --once : Storage 에서 일봉·종목 목록 받아 지금 시세로 한 번 계산 (2~4분)
#   매수 후보는 15:10 이후에만 나옴. 15:20 이후에 누르면 매수 후보 상위 3 을 저장 → 다음 날 저녁 배치가 검증 결과를 매김
#   ⚠ 주문은 하지 않는다
name: closingbet

on:
  repository_dispatch:
    types: [closingbet_request]
  workflow_dispatch:

concurrency:
  group: stockeye-closingbet
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      NAVER_HUB_ID: ${{ secrets.NAVER_HUB_ID }}
      NAVER_HUB_SECRET: ${{ secrets.NAVER_HUB_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 일봉 데이터 캐시 (저녁 배치 캐시와 따로 — 바뀐 조각만 Storage 에서 받기)
        uses: actions/cache@v4
        with:
          path: data
          key: stockeye-cbdata-${{ github.run_id }}
          restore-keys: stockeye-cbdata-
      - run: pip install -r backend/requirements.txt
      - name: 종가배팅 종목찾기
        working-directory: backend
        run: python -m scripts.closingbet --cloud --once
