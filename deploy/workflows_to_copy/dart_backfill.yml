# DART 공시·재무 5년치 채우기 (매수후보 V2 준비, 한 번만 실행)
#   GitHub → Actions → dart-backfill → Run workflow
#   하루 호출 한도(2만 회)에 걸리면 다음 날 한 번 더 실행하면 이어서 받습니다.
name: dart-backfill

on:
  workflow_dispatch:
    inputs:
      what:
        description: "무엇을 받을지"
        type: choice
        options: [all, financials, disclosures]
        default: all
      start_year:
        description: "시작 연도"
        default: "2020"

concurrency:
  group: stockeye-batch
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 패키지 설치
        run: pip install -r backend/requirements.txt
      - name: DART 백필
        working-directory: backend
        run: python -m scripts.dart_backfill --what ${{ inputs.what }} --start-year ${{ inputs.start_year }}
