# 앱 빌드·배포: 웹(Cloudflare Pages) + 안드로이드 APK
#   app/ 폴더가 바뀌어 push 되거나, Actions 탭에서 수동 실행할 때
# 필요한 Secrets: SUPABASE_URL, SUPABASE_ANON_KEY (anon 공개키 — 앱에 들어가도 되는 키)
#                웹 배포: VERCEL_TOKEN (권장) 또는 CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
#                (둘 다 없으면 웹 배포만 건너뜀, APK 는 Actions 결과물로 받기)
# Variables(선택): PAGES_PROJECT = 웹 주소 이름 (기본 stockeye), WEB_URL = 웹 주소 (인증 메일 링크용)
# 로또만 바뀐 push (지금 배포된 주식눈 커밋 이후 app/web/lotto/ 밖은 그대로, 2026-10-16): 주식눈 빌드 번호를 안 올림
#   → 지금 배포된 version.json 의 번호·시각을 그대로 쓰고 stockeye.apk 도 배포된 것을 받아 그대로 다시 올림
#     (주식눈 앱에 '업데이트 있어요' 안내가 안 뜸). 배포된 걸 못 받으면 평소처럼 새 번호로 빌드
name: app-build

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

concurrency:
  group: stockeye-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'stockeye' }}
      WEB_URL: ${{ vars.WEB_URL }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 로또만 바뀌었나 (그러면 주식눈 빌드 번호 그대로)
        env:
          SITE: ${{ vars.SITE_URL || 'https://stockeye-pacific74.vercel.app' }}   # 지금 배포된 주소 (Variables SITE_URL 로 바꿀 수 있음)
        run: |
          # 기준 = 지금 배포된 주식눈의 커밋 (version.json 의 commit) — 이번 push 만이 아니라 그 뒤로 쌓인 변경 전부를 봄
          #   (주식눈 push 의 빌드가 취소됐거나 실패했어도 그 변경을 놓치지 않게)
          echo "LOTTO_ONLY=0" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" != "push" ]; then echo "수동 실행 → 평소처럼 빌드"; exit 0; fi
          SITE="${SITE%/}"
          mkdir -p "$RUNNER_TEMP/keep"
          if ! curl -fsSL "$SITE/version.json" -o "$RUNNER_TEMP/keep/version.json"; then
            echo "::warning::배포된 version.json 을 못 받음 → 평소처럼 빌드"; exit 0; fi
          read OLD_BUILD OLD_COMMIT < <(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(d.get('build',''),d.get('commit',''))" "$RUNNER_TEMP/keep/version.json")
          OLD_TIME=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('time',''))" "$RUNNER_TEMP/keep/version.json")
          if [ -z "$OLD_COMMIT" ] || ! git cat-file -e "$OLD_COMMIT^{commit}" 2>/dev/null; then
            echo "배포된 커밋($OLD_COMMIT)을 못 찾음 → 평소처럼 빌드"; exit 0; fi
          CHANGED=$(git diff --name-only "$OLD_COMMIT" "$GITHUB_SHA" -- . ../.github/workflows/app.yml || true)
          echo "배포된 주식눈($OLD_COMMIT · 빌드 $OLD_BUILD) 이후 바뀐 파일:"; echo "$CHANGED"
          if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -qv '^app/web/lotto/'; then
            echo "주식눈 코드도 바뀜 → 평소처럼 새 번호로 빌드"; exit 0; fi
          if curl -fsSL "$SITE/stockeye.apk" -o "$RUNNER_TEMP/keep/stockeye.apk" \
             && [ "$(stat -c %s "$RUNNER_TEMP/keep/stockeye.apk")" -gt 1000000 ]; then
            { echo "LOTTO_ONLY=1"; echo "OLD_BUILD=$OLD_BUILD"; echo "OLD_TIME=$OLD_TIME"; echo "OLD_COMMIT=$OLD_COMMIT"; } >> "$GITHUB_ENV"
            echo "로또만 바뀜 → 주식눈 빌드 번호 $OLD_BUILD 그대로 · APK 는 배포된 것 그대로"
          else
            echo "::warning::배포된 stockeye.apk 를 못 받음 → 평소처럼 빌드"
          fi
      - name: Supabase 설정 확인
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets 에 SUPABASE_URL / SUPABASE_ANON_KEY 를 넣어 주세요"; exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 플랫폼 폴더 준비 (없는 것만 생성, 기존 코드는 그대로)
        run: |
          flutter create --platforms=web,android,windows --project-name stockeye --org com.stockeye . >/dev/null
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="StockEye"#' $M
          # 업데이트 안내에서 APK 주소(https)를 브라우저로 열기 (안드로이드 11+ 패키지 공개 범위)
          grep -q 'android:scheme="https"' $M || sed -i 's#</manifest>#    <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n</manifest>#' $M
          # 당일매매 음성 안내 (flutter_tts): 안드로이드 11+ 에서 TTS 엔진 찾기
          grep -q "TTS_SERVICE" $M || sed -i 's#</manifest>#    <queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>\n</manifest>#' $M
          # 업데이트 버튼 → 앱 안에서 APK 받아 설치 화면 열기 (open_filex): 설치 권한
          grep -q "REQUEST_INSTALL_PACKAGES" $M || sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application#' $M
          sed -i 's#<title>.*</title>#<title>StockEye</title>#' web/index.html
      - run: flutter pub get
      - name: 앱 아이콘
        run: dart run flutter_launcher_icons
      - name: 코드 점검
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: 버전 정보 (화면 하단에 표시)
        run: |
          if [ "$LOTTO_ONLY" = "1" ]; then
            echo "APP_TIME=$OLD_TIME" >> "$GITHUB_ENV"
            echo "APP_DEFINES=--dart-define=APP_BUILD=$OLD_BUILD --dart-define=APP_COMMIT=$OLD_COMMIT" >> "$GITHUB_ENV"
          else
            echo "APP_TIME=$(TZ=Asia/Seoul date '+%m/%d %H:%M')" >> "$GITHUB_ENV"
            echo "APP_DEFINES=--dart-define=APP_BUILD=${{ github.run_number }} --dart-define=APP_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: 웹 빌드
        run: flutter build web --release --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY --dart-define=WEB_URL=$WEB_URL $APP_DEFINES "--dart-define=APP_TIME=$APP_TIME"
      - name: 안드로이드 APK 빌드
        if: env.LOTTO_ONLY != '1'
        run: |
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY --dart-define=WEB_URL=$WEB_URL $APP_DEFINES "--dart-define=APP_TIME=$APP_TIME"
      - name: APK 고정 키로 서명 (설치된 앱에 덮어쓰기 업데이트 가능)
        if: env.KS_B64 != '' && env.LOTTO_ONLY != '1'
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/stockeye.jks"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks "$RUNNER_TEMP/stockeye.jks" --ks-key-alias stockeye \
              --ks-pass env:KS_PASS --key-pass env:KS_PASS "$f"
          done
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | head -3
          rm -f "$RUNNER_TEMP/stockeye.jks"
      - name: APK 를 웹 주소에 올릴 준비 (+ 앱 업데이트 안내용 version.json)
        run: |
          if [ "$LOTTO_ONLY" = "1" ]; then                 # 로또만 바뀜: 배포돼 있던 APK·version.json 그대로
            cp "$RUNNER_TEMP/keep/stockeye.apk" build/web/stockeye.apk
            cp "$RUNNER_TEMP/keep/version.json" build/web/version.json
            cat build/web/version.json; exit 0
          fi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/web/stockeye.apk
          printf '{"build": %s, "time": "%s", "commit": "%s", "apk": "stockeye.apk"}\n' \
            "${{ github.run_number }}" "$APP_TIME" "${GITHUB_SHA::7}" > build/web/version.json
          cat build/web/version.json
      - uses: actions/upload-artifact@v4
        if: env.LOTTO_ONLY != '1'
        with:
          name: stockeye-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
      - name: 웹 배포 (Vercel)
        if: env.VERCEL_TOKEN != ''
        run: |
          rm -rf "/tmp/$PAGES_PROJECT" && cp -r build/web "/tmp/$PAGES_PROJECT" && cd "/tmp/$PAGES_PROJECT"
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" > /tmp/vercel_url.txt
          URL=$(tail -n 1 /tmp/vercel_url.txt)
          echo "배포 주소: $URL"
          {
            echo "### 배포 완료 (Vercel)"
            echo "- 이번 배포: $URL"
            echo "- 고정 주소: Vercel 대시보드 → 프로젝트 $PAGES_PROJECT → Domains (보통 https://$PAGES_PROJECT.vercel.app)"
            echo "- 안드로이드: (고정 주소)/stockeye.apk"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cloudflare Pages 프로젝트 준비
        if: env.CF_TOKEN != '' && env.VERCEL_TOKEN == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create "$PAGES_PROJECT" --production-branch main || true
      - name: 웹 배포 (Cloudflare Pages)
        if: env.CF_TOKEN != '' && env.VERCEL_TOKEN == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy build/web --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
          echo "### 배포 완료" >> $GITHUB_STEP_SUMMARY
          echo "- 웹: https://$PAGES_PROJECT.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "- 안드로이드: https://$PAGES_PROJECT.pages.dev/stockeye.apk" >> $GITHUB_STEP_SUMMARY
