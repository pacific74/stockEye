<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style></head><body>
<title>고스톱 한판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;900&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#111918;--panel:#1a2423;--panel2:#212e2c;--line:#2d3c39;
  --ink:#eee6d3;--muted:#98a69e;--faint:#6d7c76;
  --brass:#d3a74d;--brass-ink:#1c1507;--red:#e8665a;
  --serif:"Noto Serif KR","Nanum Myeongjo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 24px;min-height:100%;display:flex;flex-direction:column}
section{display:flex;flex-direction:column;gap:18px;flex:1}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px 16px;font-weight:600;text-align:left;display:flex;align-items:center;gap:14px;width:100%;transition:background .15s,border-color .15s}
.btn:hover{border-color:#40524e}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);justify-content:center;text-align:center}
.btn.primary:hover{background:#e0b55a}
.btn.small{padding:9px 12px;font-size:14px;width:auto;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:default}
.stone{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:17px}
.stone.b{background:radial-gradient(circle at 35% 30%,#5c5c5c,#0c0c0c 70%);color:#e9e2cf;box-shadow:0 2px 4px #0008}
.stone.w{background:radial-gradient(circle at 35% 30%,#ffffff,#d9d3c4 75%);color:#2b2b2b;box-shadow:0 2px 4px #0008}
.stones{display:flex;flex:none;width:48px;height:44px;position:relative}
.stones .stone{position:absolute;width:32px;height:32px}
.stones .stone.b{left:0;top:0}.stones .stone.w{right:0;bottom:0}
.btn .t{display:flex;flex-direction:column;gap:2px}
.btn .t small{font-weight:400;color:var(--muted);font-size:13px}
.linkbtn{background:none;border:0;color:var(--muted);padding:6px 4px;font-size:14px;text-decoration:none}
.linkbtn:hover{color:var(--ink)}
.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px;padding-top:6px}
.hero h1{font-family:var(--serif);font-weight:900;font-size:52px;line-height:1;letter-spacing:-.02em}
.hero h1 span{display:block;font-size:15px;font-weight:600;letter-spacing:.3em;color:var(--brass);margin-bottom:10px}
.hero p{margin:10px 0 0;color:var(--muted);font-size:14px}
.mini-board{width:112px;border-radius:6px;box-shadow:0 8px 24px #0008}
.record-line{display:flex;gap:18px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:12px}
.record-line div{display:flex;flex-direction:column}
.record-line b{font-size:20px;font-weight:600}
.record-line span{font-size:12px;color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:10px}
.resume{border-color:var(--brass)}
.footnote{color:var(--faint);font-size:12px;margin-top:auto}
.head{display:flex;align-items:center;gap:8px}
.head h2{font-family:var(--serif);font-size:24px;font-weight:900}
.field{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.field>label,.field .lbl{font-size:13px;color:var(--muted);font-weight:500}
.lvl-read{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lvl-read b{font-family:var(--serif);font-weight:900;font-size:34px;line-height:1}
.lvl-read em{font-style:normal;color:var(--brass);font-weight:600}
.lvl-read small{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--brass);height:28px}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);padding-inline:4px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.opt[aria-pressed=true]{border-color:var(--brass);background:#2b2a1f;box-shadow:inset 0 0 0 1px var(--brass)}
.opt small{color:var(--muted);font-size:12px;text-align:center}
.opt .stone{width:28px;height:28px}
.hint{font-size:13px;color:var(--muted);margin:0}
#game{gap:10px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
#g-status{font-size:14px;color:var(--muted);text-align:center;flex:1}
.pbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);transition:border-color .2s,box-shadow .2s}
.pbar.turn{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.pbar .stone{width:32px;height:32px}
.pbar .who{display:flex;flex-direction:column;min-width:0}
.pbar .who b{font-size:14px;font-weight:600}
.pbar .who span{font-size:12px;color:var(--muted)}
.pbar .pts{text-align:right;font-size:12px;color:var(--muted)}
.pbar .pts b{display:block;font-size:17px;color:var(--ink);font-weight:600}
.thinking{font-size:12px;color:var(--brass)}
.board-wrap{position:relative;align-self:center;width:min(100%,calc(100dvh - 250px));min-width:240px}
#board{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.actions .btn{justify-content:center;padding:11px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile span{font-size:12px;color:var(--muted)}
.tile b{display:block;font-size:24px;font-weight:600;margin-top:2px}
.tile b small{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
.lv-table{display:flex;flex-direction:column}
.lv-row{display:grid;grid-template-columns:78px 1fr 92px;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);font-size:14px}
.lv-row:last-child{border-bottom:0}
.lv-row .lv b{font-family:var(--serif);font-weight:900}
.lv-row .lv small{color:var(--muted);margin-left:4px}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--brass);border-radius:4px}
.lv-row .rec{text-align:right;color:var(--muted);font-size:13px}
.lv-row .rec b{color:var(--ink);font-weight:600}
.recent{display:flex;flex-direction:column}
.rg{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding-block:9px;border-bottom:1px solid var(--line);font-size:14px}
.rg:last-child{border-bottom:0}
.res{font-weight:600;font-size:13px;text-align:center;border-radius:6px;padding:2px 0}
.res.win{background:#1f4a39;color:#8fe0b9}.res.loss{background:#4a2320;color:#f2a39b}.res.draw{background:#333b39;color:#cfd6d2}
.res.bk{background:#0c0c0c;color:#eee;border:1px solid #444}.res.wh{background:#e9e3d4;color:#222}
.rg small{color:var(--muted);display:block;font-size:12px}
.empty{color:var(--muted);font-size:14px;margin:0}
.h3{font-size:14px;font-weight:600;color:var(--muted);margin:4px 0 -6px}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:10}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(100%,380px);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px #000a}
.sheet h3{font-family:var(--serif);font-weight:900;font-size:30px}
.sheet p{margin:0;color:var(--muted)}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .row .btn{flex:1;justify-content:center;min-width:110px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>

.fan{display:flex;width:120px;height:92px;position:relative}
.fan .card{position:absolute;width:56px;top:6px}
.fan .card:nth-child(1){left:0;transform:rotate(-12deg)}.fan .card:nth-child(2){left:32px;top:0;z-index:1}.fan .card:nth-child(3){left:64px;transform:rotate(12deg)}

.mine{display:flex;flex-direction:column;gap:4px;padding:6px 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}

.caps{display:grid;grid-template-columns:.85fr 1.2fr 1.2fr 1.9fr;gap:6px;min-width:0}

.cs.big{padding-right:0;flex-wrap:wrap;gap:4px;min-height:0}.cs.big .card{flex:none;width:44px}

.bd small{color:var(--muted)}
.net{font-size:20px;font-weight:700;margin:0}.net.plus{color:#8fe0b9!important}.net.minus{color:#f2a39b!important}
.rules .hint{line-height:1.7}
.hero h1{word-break:keep-all;font-size:46px}
.sheet{max-height:85vh;overflow:auto}
.pickrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.sheet{position:relative}

@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg) translateY(-4px)}75%{transform:rotate(9deg) translateY(-4px)}}

</style>

<script>/* 온라인 대전: Firebase Realtime Database REST + 실시간 스트림(EventSource) 중계 */
var NET=(function(){
var DB=(window.NET_DB_URL||'https://boardgames-abf87-default-rtdb.asia-southeast1.firebasedatabase.app').replace(/\/$/,'');
var configured=/^https?:\/\//.test(DB);
function url(p){return DB+'/rooms'+(p||'')+'.json'+(DB.indexOf('?ns=')>=0?'':'');}
function req(method,p,body){return fetch(url(p),{method:method,body:body===undefined?undefined:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error('net '+r.status);return r.json();});}
var TS={'.sv':'timestamp'};
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function myName(){return lsGet('online.v1.name','')||'';}
/* ---- live mirror of one room ---- */
function setAt(obj,path,val){var parts=path.split('/').filter(Boolean);if(!parts.length)return val;obj=obj&&typeof obj==='object'?obj:{};var o=obj;
  for(var i=0;i<parts.length-1;i++){if(!o[parts[i]]||typeof o[parts[i]]!=='object')o[parts[i]]={};o=o[parts[i]];}
  if(val===null)delete o[parts[parts.length-1]];else o[parts[parts.length-1]]=val;return obj;}
function Room(code,seat,game){this.code=code;this.seat=seat;this.game=game;this.data=null;this.applied=0;this.subs=[];this.seenAt={};this.seenVal={};this.closed=false;this.es=null;this.hb=null;}
Room.prototype.open=function(){var me=this;if(me.es)return;
  var u=url('/'+me.code);me.es=new EventSource(u);
  var handle=function(kind){return function(e){var m;try{m=JSON.parse(e.data);}catch(_){return;}if(!m)return;
    if(kind==='put')me.data=setAt(me.data,m.path,m.data);else{for(var k in m.data)me.data=setAt(me.data,(m.path=='/'?'':m.path)+'/'+k,m.data[k]);}
    me._changed();};};
  me.es.addEventListener('put',handle('put'));me.es.addEventListener('patch',handle('patch'));
  me.es.onerror=function(){me._emit('net',{ok:false});};me.es.onopen=function(){me._emit('net',{ok:true});};
  me.beat();me.hb=setInterval(function(){me.beat();me._presence();},5000);};
Room.prototype.beat=function(){if(this.closed||this.seat==null)return;req('PATCH','/'+this.code+'/seats/'+this.seat,{seen:TS,on:true}).catch(function(){});};
Room.prototype._presence=function(){var d=this.data||{},s=d.seats||{},n=d.n||2,now=Date.now(),out=[];
  for(var i=0;i<n;i++){var x=s[i];if(x&&x.seen!==this.seenVal[i]){this.seenVal[i]=x.seen;this.seenAt[i]=now;}
    out.push(!!x&&(i==this.seat||(this.seenAt[i]&&now-this.seenAt[i]<16000&&x.on!==false)));}
  this.online=out;this._emit('presence',out);};
Room.prototype._changed=function(){var d=this.data||{};this._presence();this._emit('room',d);
  var mv=d.moves||{},keys=Object.keys(mv).sort();
  if(!this.live)return;
  while(this.applied<keys.length&&keys[this.applied]===key(this.applied)){var m=mv[keys[this.applied]];this.applied++;this._emit('move',m);}};
function key(i){return 'm'+('00000'+i).slice(-5);}
Room.prototype.on=function(fn){this.subs.push(fn);};
/* game starts listening: replays every move not yet applied */
Room.prototype.listen=function(fn){this.subs=[fn];this.live=true;if(!this.es)this.open();else this._changed();};
Room.prototype._emit=function(t,v){for(var i=0;i<this.subs.length;i++){try{this.subs[i](t,v);}catch(e){console.error(e);}}};
/* local move: applied immediately by the game; echo is skipped */
Room.prototype.send=function(m){m.s=this.seat;var i=this.applied++;var me=this;
  return req('PUT','/'+this.code+'/moves/'+key(i),m).catch(function(){me._emit('net',{ok:false});setTimeout(function(){req('PUT','/'+me.code+'/moves/'+key(i),m).catch(function(){});},1500);});};
Room.prototype.patch=function(p,v){return req('PATCH','/'+this.code+(p?'/'+p:''),v).catch(function(){});};
Room.prototype.close=function(keep){this.closed=true;if(this.es)this.es.close();this.es=null;clearInterval(this.hb);
  if(this.seat!=null)req('PATCH','/'+this.code+'/seats/'+this.seat,{on:false}).catch(function(){});
  if(!keep)lsSet('online.v1.'+this.game,null);};
Room.prototype.names=function(){var s=(this.data&&this.data.seats)||{},n=(this.data&&this.data.n)||2,o=[];for(var i=0;i<n;i++)o.push(s[i]&&s[i].name||('손님'+(i+1)));return o;};
Room.prototype.finish=function(){lsSet('online.v1.'+this.game,null);this.patch('',{over:true});};
/* 한 판 더: 두 사람이 모두 누르면 rmCb()로 새 판을 시작합니다. 게임은 rematchMsg(v)에서 rm 메시지를 넘기고, rmCb를 정합니다. */
Room.prototype.askRematch=function(){this.rmAsk=true;this.send({rm:1});if(this.rmGot)this._rmGo();return this.rmGot?'start':'wait';};
Room.prototype.gotRematch=function(){this.rmGot=true;if(this.rmAsk)this._rmGo();return !this.rmAsk;};
Room.prototype._rmGo=function(){var cb=this.rmCb;this.rmAsk=this.rmGot=false;this.patch('',{over:false});if(cb)cb();};

/* ---- lobby UI ---- */
var CSS='.nl-wrap{position:fixed;inset:0;z-index:40;background:#0b1110ee;display:grid;place-items:center;padding:16px;overflow:auto}'+
'.nl{background:var(--panel,#1a2423);border:1px solid var(--line,#2d3c39);border-radius:18px;padding:24px;width:min(100%,560px);display:flex;flex-direction:column;gap:16px;color:var(--ink,#eee6d3);box-shadow:0 20px 60px #000a}'+
'.nl h3{margin:0;font-family:var(--serif,serif);font-weight:900;font-size:30px}.nl p{margin:0;color:var(--muted,#98a69e);font-size:16px;line-height:1.5}'+
'.nl .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nl button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line,#2d3c39);background:var(--panel2,#212e2c);border-radius:12px;padding:16px;font-size:18px;font-weight:700}'+
'.nl button.pri{background:var(--brass,#d3a74d);color:var(--brass-ink,#1c1507);border-color:var(--brass,#d3a74d)}.nl button:disabled{opacity:.4}'+
'.nl .code{font-family:var(--serif,serif);font-size:64px;font-weight:900;letter-spacing:.18em;text-align:center;color:var(--brass,#d3a74d);line-height:1.1}'+
'.nl input{font:inherit;font-size:22px;padding:12px 14px;border-radius:12px;border:1px solid var(--line,#2d3c39);background:#0f1615;color:var(--ink,#eee6d3);width:100%;box-sizing:border-box}'+
'.nl .codein{font-size:44px;text-align:center;letter-spacing:.3em;font-weight:900}'+
'.nl .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nl .pad button{font-size:28px;padding:12px}'+
'.nl .seats{display:flex;flex-direction:column;gap:6px}.nl .seat{display:flex;justify-content:space-between;padding:10px 14px;border-radius:10px;background:#0f1615;font-size:17px}.nl .seat b{color:var(--brass,#d3a74d)}'+
'.nl .err{color:#f2a39b;font-size:16px;min-height:1.2em}.nl .opt{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.nl .tl-seg .opt{padding:12px 4px;font-size:17px}.nl .opt[aria-pressed=true],.nl .opt button[aria-pressed=true]{border-color:var(--brass,#d3a74d);box-shadow:inset 0 0 0 2px var(--brass,#d3a74d)}'+
'@media (min-width:900px) and (min-height:600px){.nl{zoom:1.2}}';
var wrap=null;
function ui(html){if(!document.getElementById('nl-css')){var st=document.createElement('style');st.id='nl-css';st.textContent=CSS;document.head.appendChild(st);}
  if(!wrap){wrap=document.createElement('div');wrap.className='nl-wrap';document.body.appendChild(wrap);}wrap.hidden=false;wrap.style.display='grid';
  wrap.innerHTML='<div class="nl">'+html+'</div>';return wrap.querySelector('.nl');}
function closeUI(){if(wrap){wrap.style.display='none';wrap.innerHTML='';}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var GN={janggi:'장기',baduk:'바둑',omok:'오목',othello:'오델로',alkkagi:'알까기',gostop:'고스톱',memory:'짝 맞추기'};
/* opts: {game, sizes:[2] or [2,3], describe(cfg,n)->text, makeCfg(n)->cfg}  → Promise<{room,seat,n,cfg,code,names}> */
function lobby(opts){return new Promise(function(resolve,reject){
  if(!configured){var el=ui('<h3>온라인 대전</h3><p>온라인 서버가 아직 연결되지 않았습니다. 프로그램 제작자에게 문의해 주세요.</p><button class="pri">닫기</button>');el.querySelector('button').onclick=function(){closeUI();reject(new Error('cancel'));};return;}
  if(!navigator.onLine){var e2=ui('<h3>온라인 대전</h3><p>인터넷에 연결되어 있지 않습니다. 와이파이나 데이터 연결을 확인해 주세요.</p><button class="pri">닫기</button>');e2.querySelector('button').onclick=function(){closeUI();reject(new Error('cancel'));};return;}
  var n=opts.sizes[0];
  function home(){var el=ui('<h3>'+GN[opts.game]+' 온라인 대전</h3><p>방을 만든 사람이 방 번호를 친구에게 알려 주면, 친구가 그 번호로 들어와 함께 둡니다.</p>'+
    '<label><p style="margin-bottom:6px">내 이름 (상대에게 보입니다)</p><input id="nl-name" maxlength="8" placeholder="예: 김영수" value="'+esc(myName())+'"></label>'+
    (opts.sizes.length>1?'<div class="opt">'+opts.sizes.map(function(k){return '<button data-n="'+k+'" aria-pressed="'+(k===n)+'">'+k+'명이서</button>';}).join('')+'</div>':'')+
    (opts.timeLimit&&window.TMR?'<div><p style="margin-bottom:6px">시간 제한 (한 수에 · 방을 만들 때 정합니다)</p><div id="nl-tl"></div></div>':'')+
    '<div class="row"><button class="pri" id="nl-make">방 만들기</button><button id="nl-join">방 들어가기</button></div><p style="font-size:14px" id="nl-desc">'+esc(opts.describe(opts.makeCfg(n),n))+'</p><button id="nl-x">닫기</button>');
    var tlBox=el.querySelector('#nl-tl');if(tlBox)TMR.seg(tlBox,opts.timeLimit.get(),function(v){opts.timeLimit.set(v);var d=el.querySelector('#nl-desc');if(d)d.textContent=opts.describe(opts.makeCfg(n),n);});
    el.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){n=+b.dataset.n;saveName();home();};});
    el.querySelector('#nl-make').onclick=function(){if(!saveName())return;make();};el.querySelector('#nl-join').onclick=function(){if(!saveName())return;join();};

  function saveName(){var i=document.getElementById('nl-name');var v=(i&&i.value||'').trim();if(!v){i.focus();i.style.borderColor='#e8665a';return false;}lsSet('online.v1.name',v);return true;}
  function make(){var cfg=opts.makeCfg(n),tries=0;var el=ui('<h3>방 만드는 중…</h3><p>잠시만 기다려 주세요.</p>');
    (function attempt(){var code=String(1000+Math.floor(Math.random()*9000));tries++;
      req('GET','/'+code).then(function(r){if(r&&r.t&&Date.now()-r.t<6*3600e3&&!r.over&&tries<12)return attempt();
        var room={game:opts.game,n:n,cfg:cfg,t:Date.now(),seats:{0:{name:myName(),seen:TS,on:true}},over:false};
        return req('PUT','/'+code,room).then(function(){wait(code,0);});}).catch(function(){fail('서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.');});})();}
  function fail(msg){var el=ui('<h3>연결 실패</h3><p>'+msg+'</p><button class="pri">돌아가기</button>');el.querySelector('button').onclick=home;}
  function wait(code,seat){var R=new Room(code,seat,opts.game);

  function join(){var el=ui('<h3>방 들어가기</h3><p>친구에게 받은 4자리 방 번호를 넣으세요.</p><input class="codein" id="nl-code" inputmode="numeric" maxlength="4" autocomplete="off"><div class="err" id="nl-err"></div>'+

    var inp=el.querySelector('#nl-code');inp.focus();
    el.querySelectorAll('[data-k]').forEach(function(b){b.onclick=function(){var k=b.dataset.k;if(k==='지움')inp.value=inp.value.slice(0,-1);else if(k==='들어가기')go();else if(inp.value.length<4)inp.value+=k;};});

    function go(){var code=inp.value.replace(/\D/g,'');var er=el.querySelector('#nl-err');if(code.length!==4){er.textContent='번호 4자리를 넣어 주세요';return;}er.textContent='찾는 중…';
      req('GET','/'+code).then(function(r){if(!r||!r.seats){er.textContent='그런 방이 없습니다. 번호를 다시 확인해 주세요.';return;}
        if(r.game!==opts.game){er.textContent='이 번호는 '+(GN[r.game]||'다른 게임')+' 방입니다. '+(GN[r.game]||'그 게임')+'에서 들어가 주세요.';return;}

/* rejoin a saved game: Promise<{room,seat,n,cfg,code,names}> or null */
function saved(game){return lsGet('online.v1.'+game,null);}

  return req('GET','/'+s.code).then(function(r){if(!r||r.over||r.game!==game||!r.seats||!r.seats[s.seat]){lsSet('online.v1.'+game,null);return null;}
    var R=new Room(s.code,s.seat,game);return {room:R,seat:s.seat,n:r.n||2,cfg:r.cfg,code:s.code,names:null};}).catch(function(){return null;});}

return {configured:configured,lobby:lobby,rejoin:rejoin,saved:saved,forget:forget,closeUI:closeUI};
})();

<script>/* 시간 제한 + 초읽기 (한 수에 N초, 넘기면 10초 초읽기 3번, 다 쓰면 시간패) */
var TMR=(function(){
var OPTS=[0,10,20,30,40,50,60],PER=10,PERIODS=3,actx=null,master=null;
function ac(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
  if(!master){var c=actx.createDynamicsCompressor();c.threshold.value=-18;c.ratio.value=8;master=actx.createGain();master.gain.value=0.8;master.connect(c);c.connect(actx.destination);}return actx;}catch(e){return null;}}
function beep(f,dur,vol,delay){var a=ac();if(!a)return;var t=a.currentTime+0.01+(delay||0),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);}
function speak(text){try{if(window.AndroidTTS&&AndroidTTS.isReady()){AndroidTTS.speak(text);return;}}catch(e){}
  try{if(window.speechSynthesis&&window.SpeechSynthesisUtterance){var vs=speechSynthesis.getVoices(),v=vs.filter(function(x){return /^ko/i.test(x.lang);})[0];
    if(v||!vs.length){var u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';if(v)u.voice=v;u.rate=1.05;speechSynthesis.cancel();speechSynthesis.speak(u);}}}catch(e){}}
try{window.speechSynthesis&&speechSynthesis.getVoices();}catch(e){}
function label(s){return s?(s>=60?'1분':s+'초'):'없음';}
/* o: {limit, onLose(side), onUpdate(), sound()->bool, enforce(side)->bool} */
function Clock(o){this.o=o;this.left={};this.side=null;this.key=null;this.iv=null;}
Clock.prototype.reset=function(sides){var me=this;sides.forEach(function(s){me.left[s]=PERIODS;});};
Clock.prototype.turn=function(side,key){if(side==null){this.stop();this.key=null;return;}if(this.key===key&&this.iv)return;this.start(side);this.key=key;};
Clock.prototype.start=function(side){this.stop();if(this.left[side]==null)this.left[side]=PERIODS;this.side=side;this.t0=Date.now();this.phase='main';this.warned=false;this.lastTick=-1;
  var me=this;this.iv=setInterval(function(){me.tick();},200);this.tick();};
Clock.prototype.stop=function(){if(this.iv)clearInterval(this.iv);this.iv=null;this.side=null;this.key=null;if(this.o.onUpdate)this.o.onUpdate();};
Clock.prototype.snd=function(){return !this.o.sound||this.o.sound();};
Clock.prototype.tick=function(){var o=this.o,now=Date.now(),s=this.side,snd=this.snd();if(s==null)return;
  if(this.phase==='main'){var rem=o.limit-(now-this.t0)/1000,warnAt=o.limit<=10?5:10;
    if(!this.warned&&rem<=warnAt&&o.limit>warnAt){this.warned=true;if(snd&&this.mine(s)){beep(880,0.18,0.3);beep(880,0.18,0.3,0.25);speak(warnAt+'초 남았습니다');}}
    if(rem<=0){if(this.left[s]<=0){this.lose(s);return;}this.phase='by';this.b0=now;this.lastTick=-1;if(snd&&this.mine(s)){beep(660,0.3,0.3);speak('초읽기 '+this.left[s]+'번 남았습니다');}}}
  else{var r=PER-(now-this.b0)/1000,sec=Math.ceil(r);
    if(sec<=5&&sec>=1&&sec!==this.lastTick){this.lastTick=sec;if(snd&&this.mine(s))beep(sec<=3?1046:784,0.12,0.25);}
    if(r<=0){this.left[s]--;if(this.left[s]<=0){this.lose(s);return;}this.b0=now;this.lastTick=-1;if(snd&&this.mine(s)){beep(660,0.3,0.3);speak(this.left[s]===1?'마지막 초읽기입니다':'초읽기 '+this.left[s]+'번 남았습니다');}}}
  if(o.onUpdate)o.onUpdate();};
Clock.prototype.mine=function(s){return !this.o.enforce||this.o.enforce(s);};
Clock.prototype.lose=function(s){var enf=this.mine(s);this.stop();if(enf){if(this.snd()){beep(440,0.5,0.3);speak('시간이 다 되었습니다');}if(this.o.onLose)this.o.onLose(s);}};
/* display for a side: {txt, cls} */
Clock.prototype.view=function(side){var left=this.left[side]!=null?this.left[side]:PERIODS;
  if(this.side!==side||!this.iv)return{txt:'⏱ '+label(this.o.limit)+' · 남은 초읽기 '+left+'회',cls:''};
  var now=Date.now();if(this.phase==='main'){var rem=Math.max(0,Math.ceil(this.o.limit-(now-this.t0)/1000));return{txt:'⏱ '+rem+'초 · 남은 초읽기 '+left+'회',cls:rem<=(this.o.limit<=10?5:10)?'low':'run'};}
  var r=Math.max(0,Math.ceil(PER-(now-this.b0)/1000));return{txt:'초읽기 '+r+'초 · 남은 '+left+'회',cls:'by'};};
/* fill all [data-clk=side] elements */
Clock.prototype.paint=function(){var me=this;document.querySelectorAll('[data-clk]').forEach(function(el){var v=me.view(isNaN(+el.dataset.clk)?el.dataset.clk:+el.dataset.clk);el.textContent=v.txt;el.className='clk '+v.cls;});};
var CSS='.pbar>.clk{grid-column:1/-1;justify-self:start;font-size:17px!important;padding:5px 14px!important}'+'.clk,.pbar .who span.clk,.mh .clk,.oh .clk{display:inline-block;align-self:flex-start;max-width:100%;margin-top:4px;padding:3px 10px;border-radius:10px;background:#0f1615;color:var(--muted,#98a69e);font-size:15px;line-height:1.3;font-weight:700;font-variant-numeric:tabular-nums;white-space:normal;word-break:keep-all;overflow:visible}'+
  '.pbar .who span.clk.run,.clk.run{color:var(--ink,#eee6d3);background:#24332f}.pbar .who span.clk.low,.clk.low{color:#1c1507;background:#e0b55a}.pbar .who span.clk.by,.clk.by{color:#fff;background:#c0352a;animation:clkp 1s infinite}'+
  '@keyframes clkp{50%{opacity:.6}}.tl-seg{grid-template-columns:repeat(auto-fit,minmax(64px,1fr))!important}.tl-seg .opt{padding:10px 4px;font-size:16px;white-space:nowrap;word-break:keep-all;display:flex;flex-direction:row;align-items:center;justify-content:center;text-align:center}.tl-seg .opt span{white-space:nowrap}.tl-seg .opt,.nl .tl-seg .opt{display:flex!important;flex-direction:row!important;justify-content:center!important;align-items:center!important;place-items:center!important;text-align:center!important}.tl-seg .opt>span{margin:0 auto!important;text-align:center!important}';
(function(){var st=document.createElement('style');st.textContent=CSS;(document.head||document.documentElement).appendChild(st);})();
/* option buttons */
function seg(el,val,onPick){el.classList.add('seg','tl-seg');el.innerHTML=OPTS.map(function(v){return '<button class="opt" data-v="'+v+'" aria-pressed="'+(v===val)+'"><span>'+label(v)+'</span></button>';}).join('');
  el.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){onPick(+b.dataset.v);el.querySelectorAll('.opt').forEach(function(x){x.setAttribute('aria-pressed',x===b);});};});}
var HINT='한 수에 쓸 수 있는 시간입니다. 시간이 지나면 10초 초읽기를 3번 주고, 다 쓰면 시간패입니다. 10초는 5초 남았을 때, 나머지는 10초 남았을 때 알려 줍니다.';
return {Clock:Clock,seg:seg,label:label,HINT:HINT,speak:speak};
})();

<script type="text/plain" id="engine-src">// ---- cards ----
// codes: G 광, R 비광, B 고도리 열끗, K 국진(열끗/쌍피), Y 열끗, H 홍단, Q 청단, C 초단, T 비띠, P 피, S 쌍피
var DEF=[null,'GHPP','BHPP','GHPP','BCPP','YCPP','YQPP','YCPP','GBPP','KQPP','YQPP','GSPP','RYTS'];
var CODE=[];for(var _m=1;_m<=12;_m++)for(var _k=0;_k<4;_k++)CODE.push(DEF[_m][_k]);CODE.push('X','X','X');var NCARDS=51;
function mon(id){return id>=100?-1:id>=48?13:((id>>2)+1);}
function code(id){return id>=100?'D':CODE[id];}
function isBonus(id){return id>=48&&id<100;}
function kind(id){var c=code(id);if(c==='X')return'피';return c==='G'||c==='R'?'광':c==='B'||c==='K'||c==='Y'?'열':c==='H'||c==='Q'||c==='C'||c==='T'?'띠':c==='D'?'폭':'피';}
function piVal(id){var c=code(id);return c==='P'?1:(c==='S'||c==='X')?2:0;}

// ---- scoring ----
function scoreOf(capt,kAsPi){var best=null;
  var hasK=capt.indexOf(32)>=0;
  var opts=!hasK?[false]:(kAsPi===true||kAsPi===false)?[kAsPi]:[false,true];
  for(var o=0;o<opts.length;o++){var kAsPi=opts[o],g=0,bi=false,yeol=0,birds=0,tti=0,hong=0,cheong=0,cho=0,pi=0;
    for(var i=0;i<capt.length;i++){var id=capt[i],c=code(id);
      if(c==='G')g++;else if(c==='R'){g++;bi=true;}
      else if(c==='B'){yeol++;birds++;}else if(c==='Y')yeol++;
      else if(c==='K'){if(kAsPi)pi+=2;else yeol++;}
      else if(c==='H'){tti++;hong++;}else if(c==='Q'){tti++;cheong++;}else if(c==='C'){tti++;cho++;}else if(c==='T')tti++;
      else if(c==='P')pi+=1;else if(c==='S'||c==='X')pi+=2;}
    var gs=g===5?15:g===4?4:g===3?(bi?2:3):0;
    var ys=(yeol>=5?yeol-4:0)+(birds===3?5:0);
    var ts=(tti>=5?tti-4:0)+(hong===3?3:0)+(cheong===3?3:0)+(cho===3?3:0);
    var ps=pi>=10?pi-9:0;
    var r={total:gs+ys+ts+ps,g:g,gs:gs,yeol:yeol,ys:ys,birds:birds,tti:tti,ts:ts,hong:hong,cheong:cheong,cho:cho,pi:pi,ps:ps,kAsPi:kAsPi};
    if(!best||r.total>best.total||(r.total===best.total&&r.pi>best.pi))best=r;}
  return best;}

// ---- state ----
function shuffle(a,rng){for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function hasFour(ids){var c={};for(var i=0;i<ids.length;i++){var m=mon(ids[i]);c[m]=(c[m]||0)+1;if(c[m]>=4)return true;}return false;}
function deal(n,first,rng){rng=rng||Math.random;
  for(var tries=0;tries<200;tries++){var d=shuffle(Array.from({length:NCARDS},function(_,i){return i;}),rng);
    var hs=n===2?10:7,fl=n===2?8:6,hands=[],k=0;
    for(var p=0;p<n;p++){hands.push(d.slice(k,k+hs));k+=hs;}
    var floor=d.slice(k,k+fl);k+=fl;var pile=d.slice(k);
    var capt=hands.map(function(){return[];}),f0=first||0,guard=0;
    while(floor.some(isBonus)&&guard++<10){var bi=floor.findIndex(isBonus);capt[f0].push(floor[bi]);floor[bi]=pile.pop();}
    if(floor.some(isBonus))continue;
    if(hasFour(floor))continue;   // 손에 같은 달 4장(총통)은 허용
    return{n:n,T:n===2?7:3,hands:hands,capt:capt,floor:floor,pile:pile,turn:f0,
      go:hands.map(function(){return 0;}),goScore:hands.map(function(){return n===2?6:2;}),shake:hands.map(function(){return 0;}),
      ppeok:{},ppeokN:hands.map(function(){return 0;}),dummy:100,over:null,turns:0,kMode:[],kLocked:false};}
  throw new Error('deal failed');}
function clone(S){return JSON.parse(JSON.stringify(S));}
function floorOf(S,m){return S.floor.filter(function(x){return mon(x)===m;});}
function removeFrom(arr,ids){for(var i=0;i<ids.length;i++){var k=arr.indexOf(ids[i]);if(k>=0)arr.splice(k,1);}}
function handMonthCount(S,p,m){return S.hands[p].filter(function(x){return mon(x)===m;}).length;}
// options available to player at start of turn
function actions(S,p){var out=[],seen={};var h=S.hands[p];
  for(var i=0;i<h.length;i++){var id=h[i];if(isBonus(id)){out.push({bonus:id});continue;}if(id>=100){if(!seen.D){seen.D=1;out.push({dummy:true,card:id});}continue;}
    var m=mon(id),hc=handMonthCount(S,p,m),fc=floorOf(S,m).length;
    if((hc===3&&fc===1)||(hc===2&&fc===2)){if(!seen['b'+m]){seen['b'+m]=1;out.push({bomb:m});}continue;}
    out.push({card:id,shakeable:hc>=3&&fc===0});}
  return out;}
function steal(S,p){var got=0;
  for(var q=0;q<S.n;q++){if(q===p)continue;var c=S.capt[q],pick=-1;
    for(var i=0;i<c.length;i++)if(code(c[i])==='P'){pick=i;break;}
    if(pick<0)for(i=0;i<c.length;i++)if(code(c[i])==='S'||code(c[i])==='X'){pick=i;break;}
    if(pick>=0){S.capt[p].push(c[pick]);c.splice(pick,1);got++;}}
  return got;}
// bonus from hand: capture it, draw one card from the pile into hand; the same player then plays again
function playBonus(S,p,id){removeFrom(S.hands[p],[id]);S.capt[p].push(id);var drawn=null;if(S.pile.length){drawn=S.pile.pop();S.hands[p].push(drawn);}return drawn;}
// phase 1: play from hand. handChoice needed when floor has 2 of the month (pass chosen floor id).
function begin(S,p,act,handChoice){var ctx={p:p,take:[],steals:0,ev:[],m:-1,phase:'none',pair:null,card:null};
  if(act.bomb){var m=act.bomb,hs=S.hands[p].filter(function(x){return mon(x)===m;}),f=floorOf(S,m);
    removeFrom(S.hands[p],hs);removeFrom(S.floor,f);ctx.take=ctx.take.concat(hs,f);ctx.steals++;S.shake[p]++;
    for(var dd=1;dd<hs.length;dd++)S.hands[p].push(S.dummy++);ctx.ev.push('폭탄');ctx.m=m;ctx.phase='all';ctx.played=hs;}
  else if(act.dummy){removeFrom(S.hands[p],[act.card]);ctx.phase='none';}
  else{var c=act.card;m=mon(c);ctx.m=m;ctx.card=c;removeFrom(S.hands[p],[c]);if(act.shake){S.shake[p]++;ctx.ev.push('흔들기');}
    f=floorOf(S,m);
    if(f.length===0){S.floor.push(c);ctx.phase='drop';}
    else if(f.length===1){ctx.pair=f[0];ctx.phase='pair';}
    else if(f.length===2){ctx.pair=(handChoice!=null&&f.indexOf(handChoice)>=0)?handChoice:bestPick(S,p,f);ctx.phase='pair2';}
    else{removeFrom(S.floor,f);ctx.take=ctx.take.concat([c],f);ctx.phase='all';
      if(S.ppeok[m]!==undefined){ctx.steals+=(S.ppeok[m]===p?2:1);ctx.ev.push(S.ppeok[m]===p?'자뻑':'뻑 먹기');delete S.ppeok[m];}}}
  return ctx;}
// phase 2: flip. returns options array if a choice is needed for the flipped card, else null
function flip(S,ctx){ctx.bonusFlip=ctx.bonusFlip||[];while(S.pile.length&&isBonus(S.pile[S.pile.length-1])){var bx=S.pile.pop();ctx.bonusFlip.push(bx);ctx.take.push(bx);}
  if(!S.pile.length){ctx.d=null;return null;}var d=S.pile.pop();ctx.d=d;var md=mon(d);ctx.md=md;
  if(md===ctx.m)return null;var fd=floorOf(S,md);if(fd.length===2)return fd;return null;}
function finish(S,ctx,flipChoice){var p=ctx.p,d=ctx.d,md=ctx.md,m=ctx.m;
  if(d!=null&&md===m&&ctx.phase==='drop'){removeFrom(S.floor,[ctx.card]);ctx.take.push(ctx.card,d);if(S.pile.length>0){ctx.steals++;ctx.ev.push('쪽');}}  // 막판 쪽은 인정 안 함
  else if(d!=null&&md===m&&ctx.phase==='pair'){S.floor.push(ctx.card,d);S.ppeok[m]=p;S.ppeokN[p]++;ctx.ev.push('뻑');}
  else if(d!=null&&md===m&&ctx.phase==='pair2'){var f2=floorOf(S,m);removeFrom(S.floor,f2);ctx.take=ctx.take.concat([ctx.card],f2,[d]);ctx.steals++;ctx.ev.push('따닥');}
  else{
    if(ctx.phase==='pair'||ctx.phase==='pair2'){removeFrom(S.floor,[ctx.pair]);ctx.take.push(ctx.card,ctx.pair);}
    if(d!=null){var fd=floorOf(S,md);
      if(fd.length===0)S.floor.push(d);
      else if(fd.length===1){removeFrom(S.floor,fd);ctx.take.push(d,fd[0]);}
      else if(fd.length===2){var ch=(flipChoice!=null&&fd.indexOf(flipChoice)>=0)?flipChoice:bestPick(S,p,fd);removeFrom(S.floor,[ch]);ctx.take.push(d,ch);}
      else{removeFrom(S.floor,fd);ctx.take=ctx.take.concat([d],fd);
        if(S.ppeok[md]!==undefined){ctx.steals+=(S.ppeok[md]===p?2:1);ctx.ev.push(S.ppeok[md]===p?'자뻑':'뻑 먹기');delete S.ppeok[md];}}}}
  if(S.floor.length===0&&ctx.take.length&&S.pile.length>0){ctx.steals++;ctx.ev.push('싹쓸이');}
  S.capt[p]=S.capt[p].concat(ctx.take);
  if(ctx.take.indexOf(32)>=0){if(!S.kMode)S.kMode=[];S.kMode[p]=bestK(S,p);}
  var got=0;for(var k=0;k<ctx.steals;k++)got+=steal(S,p);ctx.stolen=got;
  S.turns++;
  if(S.ppeokN[p]>=3&&!S.over){ctx.ev.push('삼뻑');}
  return ctx;}
// after a turn: 'stop-auto' | 'ask' | 'none' | 'nagari'
// 국진(9월 열끗): owner picks 열끗(Y) or 쌍피(P); frozen for everyone once anyone calls 고
function hasK(S,p){return S.capt[p].indexOf(32)>=0;}
function kIsPi(S,p){return !!(S.kMode&&S.kMode[p]==='P');}
function scoreFor(S,p){if(!S.kMode)return scoreOf(S.capt[p]);return scoreOf(S.capt[p],kIsPi(S,p));}
function bestK(S,p){var a=scoreOf(S.capt[p],false),b=scoreOf(S.capt[p],true);return b.total>=a.total?'P':'Y';}
function setK(S,p,m){if(!S.kMode)S.kMode=[];if(S.kLocked&&S.kMode[p])return false;S.kMode[p]=m;return true;}
function afterTurn(S,p){var sc=scoreFor(S,p);
  if(S.ppeokN[p]>=3)return'threeppeok';
  if(sc.total>=S.T&&sc.total>S.goScore[p])return S.hands[p].length===0?'stop-auto':'ask';
  if(S.hands.every(function(h){return h.length===0;}))return'nagari';
  return'none';}
// 총통: 처음 받은 손패에 같은 달 4장
function chongtong(S,p){var c={};for(var i=0;i<S.hands[p].length;i++){var m=mon(S.hands[p][i]);if(m>=1&&m<=12){c[m]=(c[m]||0)+1;if(c[m]===4)return m;}}return 0;}
function aiChongtong(S,p,level,rng){rng=rng||Math.random;return level<5||rng()<0.6;} // true = 스톱
function doGo(S,p){S.go[p]++;S.goScore[p]=scoreFor(S,p).total;S.kLocked=true;}
function nextTurn(S){for(var k=0;k<S.n;k++){S.turn=(S.turn+1)%S.n;if(S.hands[S.turn].length)return;}}

// ---- settlement ----
function settle(S,w,carry,forced){var sw=scoreFor(S,w),base=forced||sw.total,g=S.go[w];
  var pts=g===0?base:g===1?base+1:g===2?base+2:(base+2)*Math.pow(2,g-2);
  var common=[],mult=1;
  if(g>0)common.push(g+'고');
  if(S.shake[w]){mult*=Math.pow(2,S.shake[w]);common.push('흔들기·폭탄 ×'+Math.pow(2,S.shake[w]));}
  if(sw.yeol>=7){mult*=2;common.push('멍따 ×2');}
  if(carry){mult*=Math.pow(2,carry);common.push('나가리 ×'+Math.pow(2,carry));}
  var pays=[],goBak=-1;
  function piBak(sl){return sw.ps>0&&sl.pi>=1&&sl.pi<=7;}  // 피가 0장이면 피박 아님
  for(var q=0;q<S.n;q++){if(q===w)continue;var sl=scoreFor(S,q),m=mult,tags=[];
    if(hasK(S,q)&&!S.kLocked){var alt=scoreOf(S.capt[q],!kIsPi(S,q));if(piBak(sl)&&!piBak(alt)){sl=alt;S.kMode[q]=kIsPi(S,q)?'Y':'P';tags.push('국진으로 피박 면함');}}
    if(piBak(sl)){m*=2;tags.push('피박');}
    if(sw.gs>0&&sl.g===0){m*=2;tags.push('광박');}
    if(S.go[q]>0){goBak=q;if(S.n===2){m*=2;tags.push('고박');}}
    pays.push({from:q,amount:pts*m,tags:tags});}
  if(S.n>2&&goBak>=0){var tot=0;pays.forEach(function(x){tot+=x.amount;});
    pays=pays.map(function(x){return{from:x.from,amount:x.from===goBak?tot:0,tags:x.from===goBak?x.tags.concat(['고박(독박)']):x.tags};});}
  var total=0;pays.forEach(function(x){total+=x.amount;});
  return{winner:w,base:base,pts:pts,score:sw,common:common,pays:pays,total:total};}

// ---- AI ----
var GW={X:2.5,G:7,R:5,B:4,K:3,Y:2,H:3,Q:3,C:3,T:1.5,P:1,S:2.2,D:0};
function bestPick(S,p,opts){var b=opts[0],bv=-1;for(var i=0;i<opts.length;i++){var v=GW[code(opts[i])];if(v>bv){bv=v;b=opts[i];}}return b;}
function potential(capt){var s=scoreOf(capt),v=s.total*10;
  v+=s.g*3+(s.g>=2?4:0);v+=s.yeol*0.9+(s.birds===2?5:s.birds*1.2);v+=s.tti*0.9;
  [s.hong,s.cheong,s.cho].forEach(function(x){v+=x===2?4:x*1.2;});
  v+=s.pi*0.7+(s.pi>=7?(s.pi-6)*1.2:0);return v;}
function evalFor(S,p){var mine=potential(S.capt[p]),opp=0;for(var q=0;q<S.n;q++)if(q!==p)opp=Math.max(opp,potential(S.capt[q]));
  var danger=0;for(var i=0;i<S.floor.length;i++){var c=code(S.floor[i]);if(c==='G'||c==='R'||c==='B')danger+=1.2;}
  return mine-opp*0.85-danger*0.3;}
function unseen(S,p){var u=S.pile.slice();for(var q=0;q<S.n;q++)if(q!==p)u=u.concat(S.hands[q].filter(function(x){return x<100;}));return u;}
function simulateAct(S,p,act,rng){var T=clone(S);
  if(T.pile.length){var u=unseen(T,p),d=u[Math.floor(rng()*u.length)],top=T.pile[T.pile.length-1];
    if(d!==top){var k=T.pile.indexOf(d);if(k>=0){T.pile[k]=top;T.pile[T.pile.length-1]=d;}
      else{for(var q=0;q<T.n;q++){var j=T.hands[q].indexOf(d);if(j>=0){T.hands[q][j]=top;T.pile[T.pile.length-1]=d;break;}}}}}
  var ctx=begin(T,p,act,null);flip(T,ctx);finish(T,ctx,null);return T;}
var AILV=[{rand:0.85,mc:0,noise:30},{rand:0.6,mc:0,noise:20},{rand:0.35,mc:0,noise:12},{rand:0.15,mc:0,noise:8},{rand:0,mc:4,noise:6},
  {rand:0,mc:8,noise:3},{rand:0,mc:14,noise:2},{rand:0,mc:22,noise:1},{rand:0,mc:32,noise:0.5},{rand:0,mc:48,noise:0}];
function aiAct(S,p,level,rng){rng=rng||Math.random;var cfg=AILV[Math.max(1,Math.min(10,level))-1],acts=actions(S,p);
  for(var bi=0;bi<acts.length;bi++)if(acts[bi].bonus!=null)return acts[bi];
  if(acts.length===1)return acts[0];
  if(rng()<cfg.rand){var a=acts[Math.floor(rng()*acts.length)];return a;}
  var best=acts[0],bv=-Infinity;
  for(var i=0;i<acts.length;i++){var a2=acts[i],v=0,ns=Math.max(1,cfg.mc);
    if(a2.shakeable&&level>=4)a2.shake=true;
    for(var s=0;s<ns;s++){var T=cfg.mc?simulateAct(S,p,a2,rng):(function(){var X=clone(S);var c=begin(X,p,a2,null);c.d=null;finish(X,c,null);return X;})();v+=evalFor(T,p);}
    v=v/ns+(rng()*2-1)*cfg.noise;if(v>bv){bv=v;best=a2;}}
  return best;}
function aiGo(S,p,level,rng){rng=rng||Math.random;var sc=scoreFor(S,p).total,h=S.hands[p].length;
  if(h<=1)return false;
  if(level<=2)return S.go[p]<3&&rng()<0.6;
  var threat=0;for(var q=0;q<S.n;q++){if(q===p)continue;var o=scoreOf(S.capt[q]);threat=Math.max(threat,o.total+(o.birds===2?3:0)+(o.hong===2||o.cheong===2||o.cho===2?2:0)+(o.g>=2?2:0));}
  var need=S.n===2?S.T-2:S.T-1;
  var risk=threat>=need?0.9:threat>=need-2?0.5:0.15;
  if(S.go[p]>=2)risk+=0.25;if(h<=2)risk+=0.2;
  var greed=level>=7?0:0.1*(7-level);
  return rng()>risk-greed&&rng()>0.1;}

const BONUS=[{t:'두리',c:'#c8141c',c2:'#7a0c10'},{t:'6구',c:'#2553b8',c2:'#122e6e'},{t:'보안말',c:'#1f7a4a',c2:'#0d4428'}];
function bonusSVG(id){const b=BONUS[id-48],fs=b.t.length>=3?14.5:b.t.length===2&&/\d/.test(b.t)?20:19;
  const star=(x,y,r)=>`<path d="M${x} ${y-r}L${x+r*.3} ${y-r*.3}L${x+r} ${y}L${x+r*.3} ${y+r*.3}L${x} ${y+r}L${x-r*.3} ${y+r*.3}L${x-r} ${y}L${x-r*.3} ${y-r*.3}z" fill="#e8b64c"/>`;
  return `<defs><radialGradient id="bg${id}" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="${b.c}"/><stop offset="1" stop-color="${b.c2}"/></radialGradient></defs>
  <rect x="0.5" y="0.5" width="69" height="108" rx="6" fill="#b3161b"/><rect x="3" y="3" width="64" height="103" rx="4" fill="#fbf3dc"/>
  <rect x="3" y="3" width="64" height="17" rx="4" fill="#1a1a1a"/><text x="35" y="15.5" font-size="10" font-weight="800" text-anchor="middle" fill="#e8b64c" letter-spacing="2">보너스</text>
  <circle cx="35" cy="55" r="25" fill="#e8b64c"/><circle cx="35" cy="55" r="22.5" fill="url(#bg${id})"/><circle cx="35" cy="55" r="19" fill="none" stroke="#e8b64c" stroke-width=".9" stroke-dasharray="2 2"/>
  <text x="35" y="${55+fs*0.36}" font-size="${fs}" font-weight="900" text-anchor="middle" fill="#fff" font-family="Noto Serif KR,serif" stroke="#0006" stroke-width=".6" paint-order="stroke">${b.t}</text>
  ${star(12,30,4)}${star(58,30,4)}${star(12,82,3)}${star(58,82,3)}
  <path d="M10 88h50" stroke="#e8b64c" stroke-width="1.2"/><text x="35" y="100" font-size="11.5" font-weight="900" text-anchor="middle" fill="${b.c}" font-family="Noto Serif KR,serif">쌍피</text>`;}
function cardSVG(id,cls){cls=cls||'';
  if(id==null||id<0)return `<svg class="card back ${cls}" viewBox="0 0 70 109"><rect x="0.5" y="0.5" width="69" height="108" rx="6" fill="#a3181a"/><rect x="5" y="5" width="60" height="99" rx="4" fill="none" stroke="#e8b64c" stroke-width="1.2" opacity=".6"/><circle cx="35" cy="54.5" r="13" fill="none" stroke="#e8b64c" stroke-width="1.5" opacity=".6"/><circle cx="35" cy="54.5" r="6" fill="#e8b64c" opacity=".35"/></svg>`;
  if(id>=100)return `<svg class="card back dummy ${cls}" data-id="${id}" viewBox="0 0 70 109"><rect x="0.5" y="0.5" width="69" height="108" rx="6" fill="#5a1410"/><text x="35" y="52" font-size="15" text-anchor="middle" fill="#f3e2a0" font-weight="700">폭탄</text><text x="35" y="70" font-size="10" text-anchor="middle" fill="#f3e2a0">뒤집기만</text></svg>`;
  if(id>=48)return `<svg class="card bonus ${cls}" data-id="${id}" viewBox="0 0 70 109">${bonusSVG(id)}</svg>`;
  return `<img class="card ${cls}" data-id="${id}" src="${CARD_IMG[id]}" alt="${mon(id)}월 ${LBL[code(id)]}" draggable="false">`;}

function show(name){if(name!=='game'&&CLK)CLK.turn(null);['home','setup','game','stats'].forEach(s=>$(s).hidden=s!==name);window.scrollTo(0,0);
  if(name==='home')renderHome();if(name==='stats')renderStats();if(name==='setup')renderSetup();if(name==='game'){render();loop();}}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
let toastT;function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}
let modalDismiss=null;
$('modal').addEventListener('click',e=>{if(modalDismiss&&(e.target===$('modal')||$('modal').classList.contains('anyclose')))modalDismiss();});
function viewer(html){return new Promise(res=>{const s=$('sheet'),m=$('modal');s.innerHTML=`<button class="xclose" aria-label="닫기">✕</button>`+html+'<p class="tapclose">아무 곳이나 누르면 닫힙니다</p>';
  m.classList.add('anyclose');m.hidden=false;modalDismiss=()=>{m.hidden=true;m.classList.remove('anyclose');modalDismiss=null;res(-1);};});}
function modal(html,actions){return new Promise(res=>{$('modal').classList.remove('anyclose');modalDismiss=null;const s=$('sheet');s.innerHTML=html+'<div class="row"></div>';const row=s.querySelector('.row');
  actions.forEach((a,k)=>{const b=document.createElement('button');b.className='btn small '+(a.cls||'');b.textContent=a.label;b.onclick=()=>{$('modal').hidden=true;a.fn&&a.fn();res(k);};row.appendChild(b);});
  $('modal').hidden=false;});}
let bannerT;function banner(text,who){const b=$('banner');b.textContent=text;b.className='banner show'+(who===0?' me':'');clearTimeout(bannerT);bannerT=setTimeout(()=>b.classList.remove('show'),900);say(text);}
function say(text){if(!prefs.sound)return;const t=text.replace(/[!·]/g,'')+'!';
  try{if(window.AndroidTTS&&AndroidTTS.isReady()){AndroidTTS.speak(t);return;}}catch(e){}
  try{if(window.speechSynthesis&&window.SpeechSynthesisUtterance){const vs=speechSynthesis.getVoices(),v=vs.find(x=>/^ko/i.test(x.lang));if(v||!vs.length){const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';if(v)u.voice=v;u.rate=1.15;speechSynthesis.cancel();speechSynthesis.speak(u);}}}catch(e){}}
try{window.speechSynthesis&&speechSynthesis.getVoices();}catch(e){}
let actx=null;
function snap(){if(!prefs.sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const n=1800,buf=actx.createBuffer(1,n,44100),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,6);const s=actx.createBufferSource();s.buffer=buf;const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=1;
  const g=actx.createGain();g.gain.value=1.3;s.connect(f);f.connect(g);g.connect(actx.destination);s.start();}catch(e){}}

function spec(){const land=isLand(),C=land?6:5,R=3,p=land?{c0:3,c1:4,r0:2,r1:2}:{c0:3,c1:3,r0:2,r1:2},cells=[];

let slots=[],slotKey='',jit=[];
const rnd=(a,b)=>a+Math.random()*(b-a);
function makeJit(){jit=Array.from({length:16},()=>({rot:rnd(-5,5),dx:rnd(-.06,.06),dy:rnd(-.04,.04)}));}
function randomEmpty(){const e=[];slots.forEach((m,i)=>{if(m==null)e.push(i);});return e.length?e[Math.floor(Math.random()*e.length)]:-1;}
function resetView(){pick=null;lastTaken=[];pend={played:[],flipped:[],extra:[]};lastMove={};makeJit();

  if(S){[...new Set(S.floor.map(mon))].forEach(m=>{const k=randomEmpty();if(k>=0)slots[k]=m;});}}
function syncSlots(order){const sp=spec();
  if(sp.key!==slotKey){const keep=slots.filter(m=>m!=null);slotKey=sp.key;slots=new Array(sp.cells.length).fill(null);keep.forEach(m=>{const k=randomEmpty();if(k>=0)slots[k]=m;});}
  const set=new Set(order);for(let i=0;i<slots.length;i++)if(slots[i]!=null&&!set.has(slots[i]))slots[i]=null;
  for(const m of order)if(!slots.includes(m)){const k=randomEmpty();if(k>=0)slots[k]=m;}}
/* ---- dealing animation ---- */

// 총통: 처음 받은 패에 같은 달 4장 → 스톱(10점) 또는 들고 치기(처음 낼 때 4장 흔들기 ×2, 다음에 폭탄 ×2)

async function runDeal(g0){await wait(350);

  batches.push(['F',fl.slice(a[0])]);order.forEach(p=>batches.push([p,hs[p].slice(a[1])]));

    for(const id of ids){if(g0!==gen||!deal)return;
      if(t==='F')deal.floor.push(id);else deal.hand[t].push(id);deal.left--;
      if(deal.skip||$('game').hidden)continue;

/* ---- motion ---- */
function slam(){if(!prefs.sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(110,t+0.1);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.006);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);

function srcRect(p,id){if(p===0){const b=document.querySelector(`#hand .hc[data-id="${id}"]`)||$('hand');return b.getBoundingClientRect();}

function capEl(p){return document.querySelector(p===0?'#mine .cap:last-child .cs':`.opp[data-q="${p}"] .cap:last-child .cs`);}
function fly(id,from,toEl,o){o=o||{};return new Promise(res=>{

  if(!to||!to.width){const f=$('floor').getBoundingClientRect(),w=o.w||50;to={left:f.left+f.width/2-w/2,top:f.top+f.height/2-w*.78,width:w,height:w*1.557};}

/* ---- music & sound (synthesised; 국악 5음계 + 장구 장단 느낌) ---- */
const NOTE={G3:196,A3:220,B3:246.94,D4:293.66,E4:329.63,G4:392,A4:440,B4:493.88,D5:587.33,E5:659.25,G5:783.99,A5:880,B5:987.77,D6:1174.66};
function AC(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}}
// 모든 음악은 리미터를 거쳐 나가므로 겹쳐도 찢어지는 소리가 나지 않음
let MASTER=null;function master(){const a=AC();if(!a)return null;if(MASTER&&MASTER.context===a)return MASTER;
  const comp=a.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=12;comp.ratio.value=8;comp.attack.value=0.003;comp.release.value=0.25;
  const g=a.createGain();g.gain.value=0.7;g.connect(comp);comp.connect(a.destination);MASTER=g;return g;}
function tone(f,t,dur,type,vol,out){const a=AC();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.025);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(out||master());o.start(t);o.stop(t+dur+0.05);}
// 부드러운 북소리 (작은 스피커에서도 깨지지 않도록 저음을 쓰지 않음)
function thump(t,vol,f0,out){const a=AC();if(!a)return;const o=a.createOscillator(),g=a.createGain(),f=Math.max(170,f0||200);o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*0.62,t+0.14);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.min(0.22,(vol||0.3)*0.5),t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);o.connect(g);g.connect(out||master());o.start(t);o.stop(t+0.24);}
function tick(t,vol,out){const a=AC();if(!a)return;const n=900,buf=a.createBuffer(1,n,44100),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,10);
  const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=2400;f.Q.value=2;const g=a.createGain();g.gain.value=Math.min(0.12,vol||0.1);s.connect(f);f.connect(g);g.connect(out||master());s.start(t);}
function mel(seq,step,type,vol){const a=AC();if(!a||!prefs.sound)return;let t=a.currentTime+0.03;seq.forEach(n=>{if(n){const [nm,len]=Array.isArray(n)?n:[n,1];tone(NOTE[nm],t,step*len*1.6,type,vol);}t+=step*(Array.isArray(n)?n[1]:1);});}
// 고 팡파르: 고가 많을수록 음이 높고 길어짐
function goFanfare(n){if(!prefs.sound)return;const a=AC();if(!a)return;const t=a.currentTime;
  const seqs=[null,['G4','A4',['D5',2]],['G4','A4','B4','D5',['E5',2]],['D5','E5','G5','A5',['B5',2]],['E5','G5','A5','B5','D6',['D6',2]]];
  const seq=seqs[Math.min(n,4)]||seqs[1];
  for(let i=0;i<(n>=3?6:n>=2?4:2);i++)thump(t+i*0.08,0.3,220);
  setTimeout(()=>{mel(seq,0.11,'triangle',0.14);mel(seq,0.11,'sine',0.08);if(n>=3)[NOTE.G4,NOTE.B4,NOTE.D5].forEach(f=>tone(f,a.currentTime+0.1+seq.length*0.11,0.9,'sine',0.06));},n>=3?520:300);}
function stopJingle(win){if(!prefs.sound)return;if(win){mel(['D5','B4','D5','E5',['G5',3]],0.12,'triangle',0.15);mel([null,null,null,null,['G4',3]],0.12,'sine',0.1);}
  else mel(['E5','D5','B4',['A4',2],['G4',3]],0.16,'sine',0.14);}
// 고/스톱을 고르는 동안: 조용한 울림 + 가벼운 박자
function suspense(){if(!prefs.sound)return()=>{};const a=AC();if(!a)return()=>{};const bus=a.createGain();bus.gain.value=1;bus.connect(master());
  let next=a.currentTime+0.1;const iv=setInterval(()=>{if(document.hidden)return;while(next<a.currentTime+0.6){tick(next,0.07,bus);tick(next+0.25,0.045,bus);next+=0.95;}},200);
  return()=>{clearInterval(iv);try{bus.gain.setTargetAtTime(0.0001,a.currentTime,0.08);}catch(e){}};}
// 고가 나온 뒤 판이 끝날 때까지 작게 깔리는 5음계 가락 (고가 많을수록 조금 빨라짐)
let bgm=null;
function startBgm(level){stopBgm();if(!prefs.sound||prefs.bgm===false||!level)return;const a=AC();if(!a)return;const bus=a.createGain();bus.gain.value=1;bus.connect(master());
  const bpm=Math.min(118,84+level*8),beat=60/bpm/2;
  const tune=['G4',0,'A4','B4','D5',0,'B4','A4','G4',0,'E4','G4','A4',0,0,0,'B4',0,'D5','E5','D5',0,'B4','A4','B4',0,'A4','G4','E4',0,0,0];
  let i=0,next=a.currentTime+0.15;
  const iv=setInterval(()=>{while(next<a.currentTime+0.5){const nm=tune[i%tune.length];if(nm)tone(NOTE[nm],next,beat*0.9,'triangle',0.04,bus);if(i%4===0)tick(next,0.05,bus);i++;next+=beat;}},150);
  bgm={stop(){clearInterval(iv);try{bus.gain.setTargetAtTime(0.0001,a.currentTime,0.1);}catch(e){}},level};}
function stopBgm(){if(bgm){bgm.stop();bgm=null;}}
const maxGo=()=>S?Math.max(...S.go):0;

/* ---- turn ---- */
async function runTurn(p,act,driven){const g0=gen,dead=()=>g0!==gen,names=NAMES(S.n),sendable=meta.online&&p===0&&!driven,remoteIn=meta.online&&(p!==0||driven);
  if(sendable&&act.bonus!=null)SEND({a:{bonus:act.bonus}});
  if(act.bonus!=null){const from=srcRect(p,act.bonus);EN.playBonus(S,p,act.bonus);lastTaken=[act.bonus];
    lastMove[p]={played:[act.bonus],flipped:[]};render();
    await fly(act.bonus,from,capEl(p),{w:capW(p)});banner('보너스',p);
    toast(`${names[p]} 보너스 쌍피! 더미에서 한 장 가져와 한 번 더 냅니다`);await wait(750);if(dead())return;
    if(!S.hands[p].length)return endTurn(p,g0,driven);
    if(p!==0||(driven&&drivenNow())){render();await wait(450);if(dead())return;if(meta.online){const m=await takeRemote();if(dead())return;return runTurn(p,actOf(m),true);}return runTurn(p,EN.aiAct(S,p,meta.level));}
    busy=false;persist();render();return;}
  let hc=null;
  if(act.card!=null&&!act.dummy&&!act.bomb){const f=EN.floorOf(S,mon(act.card));if(f.length===2)hc=remoteIn?(act.hc!=null?act.hc:EN.bestPick(S,p,f)):(p===0&&!AUTO&&code(f[0])!==code(f[1]))?await pickFloor(f,'바닥에서 먹을 패 고르기'):EN.bestPick(S,p,f);}
  if(sendable)SEND({a:{card:act.card,shake:!!act.shake,bomb:act.bomb||null,dummy:!!act.dummy},hc});

async function endTurn(p,g0,driven){const dead=()=>g0!==gen;

    const stopSus=suspense();
    while(true){const sc0=EN.scoreFor(S,0).total;if(!(sc0>=S.T&&sc0>S.goScore[0])){r2='none';break;}
      const canK=EN.hasK(S,0)&&!S.kLocked,acts=[{label:'스톱'},{label:(S.go[0]+1)+'고',cls:'primary'}];if(canK)acts.unshift({label:`국진을 ${EN.kIsPi(S,0)?'열끗':'쌍피'}로`});

      r2=(canK?k-1:k)===1?'go':'stop';break;}

  let rmt=null;if(r==='ask'&&meta.online){if(p!==0||driven){rmt=await takeRemote();if(dead())return;if(rmt.k)EN.setK(S,p,rmt.k);if(rmt.go==='none')r2='none';}else SEND({go:r2==='none'?'none':r2==='go',k:(S.kMode&&S.kMode[0])||null});}

  $('ic5').innerHTML=cardSVG(8);const os=NET.saved('gostop');$('btn-oresume').hidden=!os;if(os)$('btn-oresume').innerHTML=`<span class="mini-card">${cardSVG(12)}</span><span class="t">온라인 고스톱 이어하기<small>방 번호 ${os.code}</small></span>`;
  const c=load(KEY.cur,null),rb=$('btn-resume');
  if(c&&c.S){rb.hidden=false;rb.innerHTML=`<span class="mini-card">${cardSVG(28)}</span><span class="t">이어하기<small>${c.S.n===2?'맞고':'3인 고스톱'} · 컴퓨터 ${kyu(c.meta.level)} · 남은 패 ${c.S.hands[0].length}장</small></span>`;}else rb.hidden=true;}
$('btn-online').onclick=goOnline;$('btn-oresume').onclick=()=>NET.rejoin('gostop').then(r=>{if(!r){toast('이어할 온라인 판이 없습니다');renderHome();return;}r.rejoin=true;startOnline(r);});
$('btn-resume').onclick=()=>{if(S&&!S.over)show('game');else resume();};
$('btn-2').onclick=()=>{prefs.mode=2;savePrefs();show('setup');};$('btn-3').onclick=()=>{prefs.mode=3;savePrefs();show('setup');};
$('btn-stats').onclick=()=>show('stats');
function renderSetup(){renderTL();const n=prefs.mode;$('setup-title').textContent=n===2?'맞고 (컴퓨터 1명)':'3인 고스톱 (컴퓨터 2명)';
  const l=prefs.level;$('lv').value=l;$('lv-num').textContent=l;$('lv-kyu').textContent=kyu(l);$('lv-desc').textContent=lvDesc(l);
  const s=modeStats(n,l);$('lv-rec').textContent=s.n?`이 난이도 ${s.n}판 ${s.w}승 · 승률 ${pct(s.w,s.n)} · 누적 ${s.net>=0?'+':''}${s.net}점`:'이 난이도에서 아직 친 판이 없습니다.';
  $('rule-text').innerHTML=(n===2?'한 사람당 10장, 바닥 8장. <b>7점</b> 이상 나면 고/스톱.':'한 사람당 7장, 바닥 6장. <b>3점</b> 이상 나면 고/스톱.')+
   ' 광 3장 3점(비광 끼면 2점)·4장 4점·5장 15점, 열끗·띠 5장부터 1점, 피 10장부터 1점(쌍피 2장값), 고도리 5점, 홍단·청단·초단 각 3점. 쪽·따닥·싹쓸이·뻑 먹기·폭탄은 피 1장씩 가져옵니다. 1고 +1, 2고 +2, 3고부터 2배씩. 피박·광박·멍따·흔들기·폭탄 2배, 고박, 나가리 다음 판 2배, 뻑 3번이면 바로 승리. 국진(9월 열끗)은 열끗이나 쌍피 중 골라 쓰며, 누구든 고를 하면 고정됩니다. 피가 0장이면 피박이 아닙니다. 막판(마지막 패) 쪽은 인정하지 않습니다. 처음 받은 패에 같은 달 4장(총통)이면 바로 스톱(10점)하거나 들고 칠 수 있습니다. 보너스 쌍피 3장(두리·6구·보안말): 손에서 내면 바로 먹고 더미에서 한 장 가져와 한 번 더 내며, 더미에서 뒤집히면 바로 먹고 한 장 더 뒤집습니다.';}
$('lv').oninput=e=>{prefs.level=+e.target.value;savePrefs();renderSetup();};
$('start').onclick=()=>startMode(prefs.mode);
function fmtDate(t){const d=new Date(t);return `${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function renderStats(){const n=prefs.statMode;document.querySelectorAll('#st-mode .opt').forEach(b=>{b.setAttribute('aria-pressed',+b.dataset.mode===n);b.onclick=()=>{prefs.statMode=+b.dataset.mode;savePrefs();renderStats();};});
  const s=modeStats(n);
  $('st-tiles').innerHTML=`<div class="tile"><span>판 수</span><b class="num">${s.n}<small>${s.w}승 ${s.l}패${s.nag?' · 나가리 '+s.nag:''}</small></b></div><div class="tile"><span>승률</span><b class="num">${pct(s.w,s.n)}</b></div><div class="tile"><span>누적 점수</span><b class="num">${s.net>=0?'+':''}${s.net}</b></div><div class="tile"><span>한 판 최고</span><b class="num">${s.best}<small>최다 ${s.maxGo}고</small></b></div>`;
  let rows='';for(let l=1;l<=10;l++){const x=modeStats(n,l);const w=x.n?x.w/x.n*100:0;
    rows+=`<div class="lv-row"><span class="lv"><b class="num">${l}</b><small>${kyu(l)}</small></span><span class="bar"><i style="width:${w}%"></i></span><span class="rec num">${x.n?`<b>${pct(x.w,x.n)}</b> · ${x.n}판`:'기록 없음'}</span></div>`;}
  $('st-levels').innerHTML=rows;
  const rc=records.filter(r=>r.mode===n).slice(-15).reverse();
  $('st-recent').innerHTML=rc.length?rc.map(r=>{const tag=r.winner===0?'승':r.winner===-1?'나가리':'패',cls=r.winner===0?'win':r.winner===-1?'draw':'loss';
    return `<div class="rg"><span class="res ${cls}">${tag}</span><span>컴퓨터 ${kyu(r.level)}<small>${r.winner===0?(r.go?r.go+'고 · ':'')+r.reason:r.winner===-1?'다음 판 2배':'상대 '+r.reason}</small></span><span class="num" style="text-align:right;font-weight:600;color:${r.net>0?'#8fe0b9':r.net<0?'#f2a39b':'var(--muted)'}">${r.net>0?'+':''}${r.net}<small style="display:block;font-weight:400;color:var(--muted)">${fmtDate(r.t)}</small></span></div>`;}).join(''):'<p class="empty">판을 마치면 여기에 기록됩니다.</p>';}
$('st-reset').onclick=()=>modal('<h3>전적 초기화</h3><p>고스톱 기록을 모두 지웁니다. 되돌릴 수 없습니다.</p>',[{label:'취소'},{label:'모두 지우기',cls:'primary',fn:()=>{records=[];save(KEY.rec,records);renderStats();toast('전적을 지웠습니다');}}]);
/* ---- 온라인 고스톱 ---- */
let ON=null,SEAT=0,RQ=[],RW=null,ONAMES=[],OPP=[true,true,true];
function FAST(){return !!(meta&&meta.online&&RQ.length>1);}
function drivenNow(){return !!(meta&&meta.online&&RQ.length&&RQ[0].s===SEAT);}
function takeRemote(){return new Promise(res=>{if(RQ.length)res(RQ.shift());else RW=res;});}
function pushRemote(m){if(RW){const r=RW;RW=null;r(m);}else RQ.push(m);}
function SEND(m){if(ON)ON.send(m);}
function actOf(m){const a=m.a||{};const o={};if(a.bonus!=null)o.bonus=a.bonus;else{o.card=a.card;if(a.shake)o.shake=true;if(a.bomb)o.bomb=a.bomb;if(a.dummy)o.dummy=true;if(m.hc!=null)o.hc=m.hc;}return o;}
function onNames(n){const o=[];for(let q=0;q<n;q++)o.push(q===0?'나':(ONAMES[(q+SEAT)%n]||'손님'));return o;}
function oppState(q){return OPP[(q+SEAT)%meta.n]===false?'<b style="color:var(--red)">연결 끊김</b>':'온라인';}
function rotS(Sg){const n=Sg.n,k=SEAT,S2=JSON.parse(JSON.stringify(Sg)),rot=a=>a.map((_,q)=>a[(q+k)%n]);
  ['hands','capt','go','goScore','shake','ppeokN'].forEach(f=>{S2[f]=rot(Sg[f]);});
  const km=[];if(Sg.kMode)for(let q=0;q<n;q++)if(Sg.kMode[(q+k)%n])km[q]=Sg.kMode[(q+k)%n];S2.kMode=km;
  S2.turn=(Sg.turn-k+n)%n;S2.ppeok={};for(const m in (Sg.ppeok||{}))S2.ppeok[m]=(Sg.ppeok[m]-k+n)%n;return S2;}
function startRound(Sg,carry){$('modal').hidden=true;if(carry!=null)meta.carry=carry;meta.first=(Sg.turn-SEAT+meta.n)%meta.n;newRound(rotS(Sg));}
function hostDeal(){const firstG=(meta.first+SEAT)%meta.n,Sg=EN.deal(meta.n,firstG);SEND({deal:JSON.stringify(Sg),carry:meta.carry});startRound(Sg);}
function waitDeal(){const g0=gen;takeRemote().then(m=>{if(!meta||!meta.online)return;if(m.deal)startRound(JSON.parse(m.deal),m.carry||0);else{console.warn('unexpected',m);waitDeal();}});}
function nextBtns(){if(!meta.online)return [{label:'메뉴',fn:()=>show('home')},{label:'판 보기'},{label:'다음 판',cls:'primary',fn:()=>newRound()}];
  if(SEAT===0&&!drivenNow())return [{label:'다음 판',cls:'primary',fn:()=>hostDeal()}];
  setTimeout(waitDeal,0);return [{label:'판 보기'}];}
function goOnline(){NET.lobby({game:'gostop',timeLimit:{get:()=>prefs.tl||0,set:v=>{prefs.tl=v;savePrefs();}},sizes:[2,3],makeCfg:n=>({n,tl:prefs.tl||0}),describe:(c,n)=>'시간 제한 '+TMR.label(c.tl)+' · '+(n===2?'맞고: 두 사람이 칩니다 · 7점부터 고/스톱 · 한 사람당 10장':'3인 고스톱: 세 사람이 칩니다 · 3점부터 고/스톱 · 한 사람당 7장')}).then(startOnline).catch(()=>{});}
window.__gs={get busy(){return busy;},get rw(){return !!RW;},get deal(){return !!deal;},get S(){return S;},get meta(){return meta;},get seat(){return SEAT;},get rq(){return RQ.length;}};
function startOnline(res){ON=res.room;SEAT=res.seat;RQ=[];RW=null;ONAMES=res.names||[];gen++;S=null;
  meta={n:res.n,level:0,carry:0,first:0,tl:(res.cfg&&res.cfg.tl)||0,t:Date.now(),online:true};mkClock();
  ON.listen((t,v)=>{if(!meta||!meta.online||ON!==res.room)return;
    if(t==='move')pushRemote(v);else if(t==='presence'){OPP=v;if(S)render();}else if(t==='room'){ONAMES=ON.names();if(S)render();}});
  show('game');$('g-status').textContent='판을 준비하는 중…';
  if(SEAT===0&&!res.rejoin)hostDeal();else waitDeal();
  toast(res.n===2?'맞고를 시작합니다':'3인 고스톱을 시작합니다',2000);}
/* ---- 시간 제한 (내 차례에 패 내기) ---- */
let CLK=null,AUTO=false;
function renderTL(){document.querySelectorAll('.tl-box').forEach(el=>TMR.seg(el,prefs.tl||0,v=>{prefs.tl=v;savePrefs();}));}
function mkClock(){if(CLK)CLK.stop();CLK=meta&&meta.tl?new TMR.Clock({limit:meta.tl,sound:()=>prefs.sound!==false,onUpdate:()=>{if(CLK)CLK.paint();},onLose:()=>autoPlay()}):null;if(CLK)CLK.reset([0]);}
function clockTurn(){if(!CLK)return;if(!S||S.over||deal||busy||pick||S.turn!==0||$('game').hidden){CLK.turn(null);return;}CLK.turn(0,gen+':'+S.hands[0].length+':'+S.pile.length);CLK.paint();}
function autoPlay(){if(!S||S.over||busy||S.turn!==0)return;toast('시간이 다 되어 자동으로 패를 냅니다',2500);busy=true;AUTO=true;
  const act=EN.aiAct(S,0,5);runTurn(0,act).catch(e=>console.error(e)).finally(()=>{AUTO=false;});}
show('home');
})();
</script>
