# 관심종목 적중률 계산 (HIT) → 앱 '검증' 화면.  매주 자동 실행은 없앰 (2026-10-11) — 필요할 때만:
#   ① 앱 '검증' 화면 [계산 요청] → Supabase 가 바로 신호(repository_dispatch hitrate_request)
#      (Supabase app_config 에 github_dispatch_token·github_repo 가 있어야 함 — 패턴 요청과 같은 설정)
#   ② 여기 Actions → Run workflow, only 칸:
#   비움 또는 HIT     = 적중률 전체 (5개 탭 × 5년, 약 45분 — V3 를 매일 다시 계산하는 데 대부분)
#   HIT:nextday       = 적중률, 탭 하나 (여러 개: HIT:nextday,early)
#   HIT:2025          = 적중률, 연도 하나 (여러 개: HIT:2024,2025)
#   HIT:early:2024,2025 = 적중률, 탭 + 연도
#   탭 이름: v3 · nextday(익일유망주) · early(상승초기) · reversal(추세전환) · uplimit(상파)
#   일부만 돌리면 나머지 탭·연도는 이전 결과를 그대로 두고 합친다.
#   (예전 검증, 앱에는 안 보임) VALID = 상세 검증 · ALL = V3 기준 전략·V2 엔진·상세 검증·적중률 전부 (몇 시간)
name: weekly-backtest

on:
  repository_dispatch:
    types: [hitrate_request]
  workflow_dispatch:
    inputs:
      only:
        description: "비우면 적중률 전체 | HIT:nextday=탭 하나(v3·nextday·early·reversal·uplimit, 여러개는 쉼표) | HIT:2025=연도 | HIT:early:2024,2025=탭+연도"
        required: false
        default: ""

concurrency:
  group: stockeye-batch
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      ONLY: ${{ inputs.only || github.event.client_payload.only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: 적중률 계산
        working-directory: backend
        # 입력값은 환경변수로만 넘김 (명령줄에 직접 넣지 않음)
        run: |
          if [ -n "$ONLY" ]; then python -m scripts.cloud_backtest --only "$ONLY"; else python -m scripts.cloud_backtest; fi
