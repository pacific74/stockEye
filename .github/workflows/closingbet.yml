# 종가배팅 종목찾기 (한 번) → 앱 메인·'관심 > 종가배팅'  — PC 꺼져 있어도 됨
#   ① 앱 [종목찾기] 버튼(관리자) → Supabase 가 바로 신호(repository_dispatch closingbet_request)
#   ② 여기 Actions → Run workflow
#   python -m scripts.closingbet --cloud --once : Storage 에서 일봉·종목 목록 받아 지금 시세로 한 번 계산 (보통 1~2분: 거래대금 상위 40개 · 여러 종목 동시에 · 필요한 패키지만 설치)
#   매수 후보는 15:10 이후에만 나옴. 15:20 이후에 누르면 매수 후보 상위 3 을 저장 → 다음 날 저녁 배치가 검증 결과를 매김
#   ⚠ 주문은 하지 않는다
name: closingbet

on:
  repository_dispatch:
    types: [closingbet_request]
  workflow_dispatch:

concurrency:
  group: stockeye-closingbet
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      NAVER_HUB_ID: ${{ secrets.NAVER_HUB_ID }}
      NAVER_HUB_SECRET: ${{ secrets.NAVER_HUB_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-live.txt
      - run: pip install -r backend/requirements-live.txt
      - name: 종가배팅 종목찾기
        working-directory: backend
        run: python -m scripts.closingbet --cloud --once --top 40
      - name: 실패하면 앱 버튼에 '실패' 표시 (안 그러면 앱이 계속 '찾는 중')
        if: failure()
        working-directory: backend
        run: >-
          python -c "from stockeye.cloud.client import Supabase; from stockeye.cloud import publish as pub;
          pub.publish_status(Supabase(), 'closingbet_job', {'status': 'failed', 'error': 'GitHub 작업 실패 — Actions 기록 확인'})"
