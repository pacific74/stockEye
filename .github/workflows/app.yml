# 앱 빌드·배포: 웹(Cloudflare Pages) + 안드로이드 APK
#   app/ 폴더가 바뀌어 push 되거나, Actions 탭에서 수동 실행할 때
# 필요한 Secrets: SUPABASE_URL, SUPABASE_ANON_KEY (anon 공개키 — 앱에 들어가도 되는 키)
#                CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (없으면 웹 배포만 건너뜀, APK 는 Actions 결과물로 받기)
name: app-build

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

concurrency:
  group: stockeye-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'stockeye' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Supabase 설정 확인
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets 에 SUPABASE_URL / SUPABASE_ANON_KEY 를 넣어 주세요"; exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 플랫폼 폴더 준비 (없는 것만 생성, 기존 코드는 그대로)
        run: |
          flutter create --platforms=web,android,windows --project-name stockeye --org com.stockeye . >/dev/null
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="StockEye"#' $M
          sed -i 's#<title>.*</title>#<title>StockEye</title>#' web/index.html
      - run: flutter pub get
      - name: 앱 아이콘
        run: dart run flutter_launcher_icons
      - name: 코드 점검
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: 웹 빌드
        run: flutter build web --release --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY --dart-define=WEB_URL=https://$PAGES_PROJECT.pages.dev
      - name: 안드로이드 APK 빌드
        run: |
          flutter build apk --release --split-per-abi --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY --dart-define=WEB_URL=https://$PAGES_PROJECT.pages.dev
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/web/stockeye.apk
      - uses: actions/upload-artifact@v4
        with:
          name: stockeye-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
      - name: Cloudflare Pages 프로젝트 준비
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create "$PAGES_PROJECT" --production-branch main || true
      - name: 웹 배포 (Cloudflare Pages)
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy build/web --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
          echo "### 배포 완료" >> $GITHUB_STEP_SUMMARY
          echo "- 웹: https://$PAGES_PROJECT.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "- 안드로이드: https://$PAGES_PROJECT.pages.dev/stockeye.apk" >> $GITHUB_STEP_SUMMARY
