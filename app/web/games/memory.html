<title>오목</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;900&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#111918;--panel:#1a2423;--panel2:#212e2c;--line:#2d3c39;
  --ink:#eee6d3;--muted:#98a69e;--faint:#6d7c76;
  --brass:#d3a74d;--brass-ink:#1c1507;--red:#e8665a;
  --serif:"Noto Serif KR","Nanum Myeongjo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 24px;min-height:100%;display:flex;flex-direction:column}
section{display:flex;flex-direction:column;gap:18px;flex:1}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px 16px;font-weight:600;text-align:left;display:flex;align-items:center;gap:14px;width:100%;transition:background .15s,border-color .15s}
.btn:hover{border-color:#40524e}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);justify-content:center;text-align:center}
.btn.primary:hover{background:#e0b55a}
.btn.small{padding:9px 12px;font-size:14px;width:auto;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:default}
.stone{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:17px}
.stone.b{background:radial-gradient(circle at 35% 30%,#5c5c5c,#0c0c0c 70%);color:#e9e2cf;box-shadow:0 2px 4px #0008}
.stone.w{background:radial-gradient(circle at 35% 30%,#ffffff,#d9d3c4 75%);color:#2b2b2b;box-shadow:0 2px 4px #0008}
.stones{display:flex;flex:none;width:48px;height:44px;position:relative}
.stones .stone{position:absolute;width:32px;height:32px}
.stones .stone.b{left:0;top:0}.stones .stone.w{right:0;bottom:0}
.btn .t{display:flex;flex-direction:column;gap:2px}
.btn .t small{font-weight:400;color:var(--muted);font-size:13px}
.linkbtn{background:none;border:0;color:var(--muted);padding:6px 4px;font-size:14px;text-decoration:none}
.linkbtn:hover{color:var(--ink)}
.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px;padding-top:6px}
.hero h1{font-family:var(--serif);font-weight:900;font-size:44px;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.hero h1 span{display:block;font-size:15px;font-weight:600;letter-spacing:.3em;color:var(--brass);margin-bottom:10px}
.hero p{margin:10px 0 0;color:var(--muted);font-size:14px}
.mini-board{width:112px;border-radius:6px;box-shadow:0 8px 24px #0008}
.record-line{display:flex;gap:18px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:12px}
.record-line div{display:flex;flex-direction:column}
.record-line b{font-size:20px;font-weight:600}
.record-line span{font-size:12px;color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:10px}
.resume{border-color:var(--brass)}
.footnote{color:var(--faint);font-size:12px;margin-top:auto}
.head{display:flex;align-items:center;gap:8px}
.head h2{font-family:var(--serif);font-size:24px;font-weight:900}
.field{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.field>label,.field .lbl{font-size:13px;color:var(--muted);font-weight:500}
.lvl-read{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lvl-read b{font-family:var(--serif);font-weight:900;font-size:34px;line-height:1}
.lvl-read em{font-style:normal;color:var(--brass);font-weight:600}
.lvl-read small{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--brass);height:28px}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);padding-inline:4px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.opt[aria-pressed=true]{border-color:var(--brass);background:#2b2a1f;box-shadow:inset 0 0 0 1px var(--brass)}
.opt small{color:var(--muted);font-size:12px;text-align:center}
.opt .stone{width:28px;height:28px}
.hint{font-size:13px;color:var(--muted);margin:0}
#game{gap:10px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
#g-status{font-size:14px;color:var(--muted);text-align:center;flex:1}
.pbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);transition:border-color .2s,box-shadow .2s}
.pbar.turn{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.pbar .stone{width:32px;height:32px}
.pbar .who{display:flex;flex-direction:column;min-width:0}
.pbar .who b{font-size:14px;font-weight:600}
.pbar .who span{font-size:12px;color:var(--muted)}
.pbar .pts{text-align:right;font-size:12px;color:var(--muted)}
.pbar .pts b{display:block;font-size:17px;color:var(--ink);font-weight:600}
.thinking{font-size:12px;color:var(--brass)}
.board-wrap{position:relative;align-self:center;width:min(100%,calc(100dvh - 250px));min-width:240px}
#board{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.actions .btn{justify-content:center;padding:11px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile span{font-size:12px;color:var(--muted)}
.tile b{display:block;font-size:24px;font-weight:600;margin-top:2px}
.tile b small{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
.lv-table{display:flex;flex-direction:column}
.lv-row{display:grid;grid-template-columns:78px 1fr 92px;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);font-size:14px}
.lv-row:last-child{border-bottom:0}
.lv-row .lv b{font-family:var(--serif);font-weight:900}
.lv-row .lv small{color:var(--muted);margin-left:4px}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--brass);border-radius:4px}
.lv-row .rec{text-align:right;color:var(--muted);font-size:13px}
.lv-row .rec b{color:var(--ink);font-weight:600}
.recent{display:flex;flex-direction:column}
.rg{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding-block:9px;border-bottom:1px solid var(--line);font-size:14px}
.rg:last-child{border-bottom:0}
.res{font-weight:600;font-size:13px;text-align:center;border-radius:6px;padding:2px 0}
.res.win{background:#1f4a39;color:#8fe0b9}.res.loss{background:#4a2320;color:#f2a39b}.res.draw{background:#333b39;color:#cfd6d2}
.res.bk{background:#0c0c0c;color:#eee;border:1px solid #444}.res.wh{background:#e9e3d4;color:#222}
.rg small{color:var(--muted);display:block;font-size:12px}
.empty{color:var(--muted);font-size:14px;margin:0}
.h3{font-size:14px;font-weight:600;color:var(--muted);margin:4px 0 -6px}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:10}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(100%,380px);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px #000a}
.sheet h3{font-family:var(--serif);font-weight:900;font-size:30px}
.sheet p{margin:0;color:var(--muted)}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .row .btn{flex:1;justify-content:center;min-width:110px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.btn:disabled{opacity:.45;cursor:default}</style>

<style>
@media (orientation: landscape) and (min-width: 700px){
  .app{max-width:none;padding-inline:clamp(24px,4vw,72px);padding-block:28px}
  #home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto 1fr;column-gap:clamp(32px,5vw,96px);row-gap:22px;align-content:start}
  #home>.app-only{grid-column:1/-1;justify-self:start}
  #home>.hero{grid-column:1;grid-row:2}
  #home>.record-line{grid-column:1;grid-row:3;align-self:start}
  #home>.menu{grid-column:2;grid-row:2 / 5;align-self:center}
  #home>.footnote{grid-column:1;grid-row:4;align-self:end}
  #home .hero h1{font-size:clamp(44px,5vw,70px)}
  #home .mini-board{width:clamp(150px,16vw,240px)}
  #home .fan{transform:scale(1.5);transform-origin:right bottom}
  #home .menu .btn{padding:20px 22px;font-size:17px}
  #setup1,#setup2,#setup,#stats{display:block;column-count:2;column-gap:clamp(32px,4vw,72px)}
  #setup1>*,#setup2>*,#setup>*,#stats>*{break-inside:avoid;margin-bottom:18px}
  #setup1>.head,#setup2>.head,#setup>.head,#stats>.head,#stats>.seg{column-span:all}
  #setup1>.btn.primary,#setup2>.btn.primary,#setup>.btn.primary{column-span:all;max-width:520px;margin-inline:auto;display:flex}

  #game{position:fixed;inset:0;z-index:3;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:auto 1fr auto auto;
    column-gap:clamp(20px,3vw,56px);row-gap:16px;padding:calc(env(safe-area-inset-top,0px) + 18px) clamp(18px,3vw,48px) calc(env(safe-area-inset-bottom,0px) + 18px)}
  #game .board-wrap{grid-column:2;grid-row:1 / -1;align-self:center;justify-self:center;width:min(calc((100dvh - 36px) * 1),calc(100vw - 520px));min-width:0}
  #game .topbar{grid-column:1;grid-row:1;flex-wrap:wrap;row-gap:4px}
  #game #bar-top{grid-column:1;grid-row:2;align-self:start}
  #game .gauge{grid-column:3;grid-row:2;align-self:end;height:44px}
  #game #bar-bot{grid-column:3;grid-row:3}
  #game .actions{grid-column:3;grid-row:4}
  #game .pbar{padding:18px 20px;gap:14px;border-radius:16px}
  #game .pbar .chip,#game .pbar .stone{width:52px;height:52px;font-size:26px}
  #game .pbar .who b{font-size:18px}
  #game .pbar .who span,#game .pbar .caps{font-size:15px}
  #game .pbar .pts b{font-size:26px}
  #game .actions .btn{padding:16px;font-size:16px}
  #game .pbar{grid-template-columns:auto minmax(0,1fr);grid-template-areas:none}
  #game .pbar>.pts{grid-column:1 / -1;text-align:left;display:flex;gap:8px;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
  #game .pbar .who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #g-status{font-size:16px;flex-basis:100%;order:3;text-align:left}
  #game .topbar .linkbtn{font-size:16px}
}
</style>
<style>
@media (orientation: landscape) and (min-width: 700px) and (max-height: 600px){
  .app{padding-block:12px}
  #game{padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(env(safe-area-inset-bottom,0px) + 8px);row-gap:6px;column-gap:18px;overflow:hidden}
  #game .board-wrap{width:min(calc((100dvh - 16px) * 1),calc(100vw - 440px))}
  #game .pbar{padding:8px 10px;gap:8px;border-radius:12px}
  #game .pbar .chip,#game .pbar .stone{width:32px;height:32px;font-size:16px}
  #game .pbar .who b{font-size:14px}
  #game .pbar .who span,#game .pbar .caps{font-size:12px}
  #game .pbar .pts b{font-size:18px}
  #game .pbar>.pts{padding-top:4px}
  #game .actions .btn{padding:8px;font-size:14px}
  #game .gauge{height:30px}
  #g-status,#game .topbar .linkbtn{font-size:13px}
  #home .hero h1{font-size:36px}
  #home .menu .btn{padding:12px 16px;font-size:15px}
}
</style>
<style>
/* ---- 시니어용 큰 글씨 · 상단 게임 메뉴 ---- */
.gnav{display:flex;gap:8px;overflow-x:auto;padding-block:4px 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.gnav a{flex:1 0 auto;text-align:center;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700;font-size:16px;white-space:nowrap}
.gnav a:hover{border-color:var(--brass)}
.gnav a.on{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
#home,#setup1,#setup2,#setup,#stats,.gnav{zoom:1.12}
.sheet{zoom:1.08}.toast{font-size:17px;padding:12px 20px}
@media (min-width:900px) and (min-height:600px){
  #home,#setup1,#setup2,#setup,#stats,.gnav{zoom:1.3}
  .sheet{zoom:1.3}.toast{zoom:1.3}
  #game .topbar,#game .pbar,#game .actions,#game .gauge,#game .oh,#game .mh{zoom:1.22}
  #game .cl{font-size:14px}
}
@media (min-width:1400px) and (min-height:800px){
  #home,#setup1,#setup2,#setup,#stats,.gnav{zoom:1.5}
  .sheet{zoom:1.45}
  #game .topbar,#game .pbar,#game .actions,#game .gauge,#game .oh,#game .mh{zoom:1.4}
  #game .cl{font-size:15px}
}
</style>
<style>
.ico{width:44px;height:44px;flex:none;display:grid;place-items:center;font-size:24px;background:var(--panel2);border-radius:12px;font-family:var(--serif);font-weight:900}
.mini-cards{display:grid;grid-template-columns:repeat(2,50px);gap:8px;transform:rotate(-4deg)}
.mc{width:50px;height:62px;border-radius:8px;display:grid;place-items:center;font-size:30px;box-shadow:0 4px 10px #0007}
.mc.b{background:repeating-linear-gradient(45deg,#7a2a22 0 6px,#8f342b 6px 12px);border:3px solid #e8d9b5}
.mc.f{background:#f7f0de;box-shadow:0 0 0 3px var(--brass),0 4px 10px #0007}
.seg.five{grid-template-columns:repeat(5,1fr)}
.opt .arr{font-size:28px;line-height:1.2}
#game{position:fixed;inset:0;z-index:3;background:var(--bg);display:grid;grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr);gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
#game .side{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#game .side .actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
#game .pbar{grid-template-columns:auto 1fr auto}
.cards-wrap{min-height:0;min-width:0;display:grid;place-items:center;overflow:hidden}
.cards{display:grid;justify-content:center;align-content:center}
.card{width:var(--cw);height:var(--ch);padding:0;border:0;background:none;perspective:900px;cursor:pointer;border-radius:10px}
.card .in{position:relative;display:block;width:100%;height:100%;transition:transform .38s ease;transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.card .back,.card .front{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;overflow:hidden}
.card .back{background:radial-gradient(circle at 50% 50%,#c9a24a 0 14%,transparent 15%),repeating-linear-gradient(45deg,#7a2a22 0 8px,#8f342b 8px 16px);border:3px solid #e8d9b5;box-shadow:0 3px 8px #0008}
.card:hover .back{border-color:var(--brass)}
.card .front{transform:rotateY(180deg);background:#f7f0de;box-shadow:0 3px 8px #0008}
.cards.hw .front{background:#fbf7ec;padding:4%}
.card .front img{width:100%;height:100%;object-fit:contain;display:block}
.emo{font-size:calc(var(--cw) * 0.6);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.card.done{cursor:default}
.card.done .front{box-shadow:0 0 0 4px var(--brass),0 3px 8px #0008}
.card.ai.done .front{box-shadow:0 0 0 4px #5fa0d6,0 3px 8px #0008}
@media (orientation: landscape) and (min-width: 700px){
  #game{grid-template-columns:minmax(250px,23vw) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:clamp(16px,2.4vw,40px);row-gap:14px;padding:calc(env(safe-area-inset-top,0px) + 16px) clamp(14px,2.4vw,40px) calc(env(safe-area-inset-bottom,0px) + 16px)}
  #game .topbar{grid-column:1;grid-row:1;flex-wrap:wrap}
  #game .side{grid-column:1;grid-row:2;grid-template-columns:1fr;align-content:center;gap:14px}
  #game .side .actions{grid-template-columns:1fr 1fr}
  #game .cards-wrap{grid-column:2;grid-row:1 / -1}
  #game .pbar>.pts{grid-column:1 / -1}
}
</style>

<section id="home">
  <div class="hero">
    <div>
      <h1><span>記 憶</span>짝 맞추기</h1>
      <p>카드를 두 장씩 뒤집어 같은 그림을 찾습니다. 혼자 기록에 도전하거나 컴퓨터와 대결하세요.</p>

    <button class="btn" id="btn-vs"><span class="ico">🤖</span><span class="t">컴퓨터와 대결<small>번갈아 뒤집어 짝을 더 많이 찾으면 승리</small></span></button>
    <button class="btn resume" id="btn-oresume" hidden></button>

    <button class="btn" id="btn-stats"><span class="ico">戰</span><span class="t">기록 · 전적<small>단계별 최고 기록과 최근 게임</small></span></button>

</section>

<section id="setup" hidden>
  <div class="head"><button class="linkbtn" data-go="home">‹ 뒤로</button><h2 id="setup-title">혼자 하기</h2></div>
  <div class="field">
    <label for="lv">단계</label>
    <div class="lvl-read"><b class="num" id="lv-num">3</b><em id="lv-kyu"></em><small id="lv-desc"></small></div>

      <button class="opt" data-v="0"><span>안 보여 주기</span><small>처음부터 뒤집힌 채로 시작</small></button>

<script>/* 온라인 대전: Firebase Realtime Database REST + 실시간 스트림(EventSource) 중계 */
var NET=(function(){
var DB=(window.NET_DB_URL||'https://boardgames-abf87-default-rtdb.asia-southeast1.firebasedatabase.app').replace(/\/$/,'');
var configured=/^https?:\/\//.test(DB);
function url(p){return DB+'/rooms'+(p||'')+'.json'+(DB.indexOf('?ns=')>=0?'':'');}
function req(method,p,body){return fetch(url(p),{method:method,body:body===undefined?undefined:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error('net '+r.status);return r.json();});}
var TS={'.sv':'timestamp'};
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function myName(){return lsGet('online.v1.name','')||'';}
/* ---- live mirror of one room ---- */
function setAt(obj,path,val){var parts=path.split('/').filter(Boolean);if(!parts.length)return val;obj=obj&&typeof obj==='object'?obj:{};var o=obj;
  for(var i=0;i<parts.length-1;i++){if(!o[parts[i]]||typeof o[parts[i]]!=='object')o[parts[i]]={};o=o[parts[i]];}
  if(val===null)delete o[parts[parts.length-1]];else o[parts[parts.length-1]]=val;return obj;}
function Room(code,seat,game){this.code=code;this.seat=seat;this.game=game;this.data=null;this.applied=0;this.subs=[];this.seenAt={};this.seenVal={};this.closed=false;this.es=null;this.hb=null;}
Room.prototype.open=function(){var me=this;if(me.es)return;
  var u=url('/'+me.code);me.es=new EventSource(u);
  var handle=function(kind){return function(e){var m;try{m=JSON.parse(e.data);}catch(_){return;}if(!m)return;
    if(kind==='put')me.data=setAt(me.data,m.path,m.data);else{for(var k in m.data)me.data=setAt(me.data,(m.path=='/'?'':m.path)+'/'+k,m.data[k]);}
    me._changed();};};
  me.es.addEventListener('put',handle('put'));me.es.addEventListener('patch',handle('patch'));
  me.es.onerror=function(){me._emit('net',{ok:false});};me.es.onopen=function(){me._emit('net',{ok:true});};
  me.beat();me.hb=setInterval(function(){me.beat();me._presence();},5000);};
Room.prototype.beat=function(){if(this.closed||this.seat==null)return;req('PATCH','/'+this.code+'/seats/'+this.seat,{seen:TS,on:true}).catch(function(){});};
Room.prototype._presence=function(){var d=this.data||{},s=d.seats||{},n=d.n||2,now=Date.now(),out=[];
  for(var i=0;i<n;i++){var x=s[i];if(x&&x.seen!==this.seenVal[i]){this.seenVal[i]=x.seen;this.seenAt[i]=now;}
    out.push(!!x&&(i==this.seat||(this.seenAt[i]&&now-this.seenAt[i]<16000&&x.on!==false)));}
  this.online=out;this._emit('presence',out);};
Room.prototype._changed=function(){var d=this.data||{};this._presence();this._emit('room',d);
  var mv=d.moves||{},keys=Object.keys(mv).sort();
  if(!this.live)return;
  while(this.applied<keys.length&&keys[this.applied]===key(this.applied)){var m=mv[keys[this.applied]];this.applied++;this._emit('move',m);}};
function key(i){return 'm'+('00000'+i).slice(-5);}
Room.prototype.on=function(fn){this.subs.push(fn);};
/* game starts listening: replays every move not yet applied */
Room.prototype.listen=function(fn){this.subs=[fn];this.live=true;if(!this.es)this.open();else this._changed();};
Room.prototype._emit=function(t,v){for(var i=0;i<this.subs.length;i++){try{this.subs[i](t,v);}catch(e){console.error(e);}}};
/* local move: applied immediately by the game; echo is skipped */
Room.prototype.send=function(m){m.s=this.seat;var i=this.applied++;var me=this;
  return req('PUT','/'+this.code+'/moves/'+key(i),m).catch(function(){me._emit('net',{ok:false});setTimeout(function(){req('PUT','/'+me.code+'/moves/'+key(i),m).catch(function(){});},1500);});};
Room.prototype.patch=function(p,v){return req('PATCH','/'+this.code+(p?'/'+p:''),v).catch(function(){});};
Room.prototype.close=function(keep){this.closed=true;if(this.es)this.es.close();this.es=null;clearInterval(this.hb);
  if(this.seat!=null)req('PATCH','/'+this.code+'/seats/'+this.seat,{on:false}).catch(function(){});
  if(!keep)lsSet('online.v1.'+this.game,null);};
Room.prototype.names=function(){var s=(this.data&&this.data.seats)||{},n=(this.data&&this.data.n)||2,o=[];for(var i=0;i<n;i++)o.push(s[i]&&s[i].name||('손님'+(i+1)));return o;};
Room.prototype.finish=function(){lsSet('online.v1.'+this.game,null);this.patch('',{over:true});};
/* 한 판 더: 두 사람이 모두 누르면 rmCb()로 새 판을 시작합니다. 게임은 rematchMsg(v)에서 rm 메시지를 넘기고, rmCb를 정합니다. */
Room.prototype.askRematch=function(){this.rmAsk=true;this.send({rm:1});if(this.rmGot)this._rmGo();return this.rmGot?'start':'wait';};
Room.prototype.gotRematch=function(){this.rmGot=true;if(this.rmAsk)this._rmGo();return !this.rmAsk;};
Room.prototype._rmGo=function(){var cb=this.rmCb;this.rmAsk=this.rmGot=false;this.patch('',{over:false});if(cb)cb();};

/* ---- lobby UI ---- */
var CSS='.nl-wrap{position:fixed;inset:0;z-index:40;background:#0b1110ee;display:grid;place-items:center;padding:16px;overflow:auto}'+
'.nl{background:var(--panel,#1a2423);border:1px solid var(--line,#2d3c39);border-radius:18px;padding:24px;width:min(100%,560px);display:flex;flex-direction:column;gap:16px;color:var(--ink,#eee6d3);box-shadow:0 20px 60px #000a}'+
'.nl h3{margin:0;font-family:var(--serif,serif);font-weight:900;font-size:30px}.nl p{margin:0;color:var(--muted,#98a69e);font-size:16px;line-height:1.5}'+
'.nl .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nl button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line,#2d3c39);background:var(--panel2,#212e2c);border-radius:12px;padding:16px;font-size:18px;font-weight:700}'+
'.nl button.pri{background:var(--brass,#d3a74d);color:var(--brass-ink,#1c1507);border-color:var(--brass,#d3a74d)}.nl button:disabled{opacity:.4}'+
'.nl .code{font-family:var(--serif,serif);font-size:64px;font-weight:900;letter-spacing:.18em;text-align:center;color:var(--brass,#d3a74d);line-height:1.1}'+
'.nl input{font:inherit;font-size:22px;padding:12px 14px;border-radius:12px;border:1px solid var(--line,#2d3c39);background:#0f1615;color:var(--ink,#eee6d3);width:100%;box-sizing:border-box}'+
'.nl .codein{font-size:44px;text-align:center;letter-spacing:.3em;font-weight:900}'+
'.nl .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nl .pad button{font-size:28px;padding:12px}'+
'.nl .seats{display:flex;flex-direction:column;gap:6px}.nl .seat{display:flex;justify-content:space-between;padding:10px 14px;border-radius:10px;background:#0f1615;font-size:17px}.nl .seat b{color:var(--brass,#d3a74d)}'+
'.nl .err{color:#f2a39b;font-size:16px;min-height:1.2em}.nl .opt{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.nl .tl-seg .opt{padding:12px 4px;font-size:17px}.nl .opt[aria-pressed=true],.nl .opt button[aria-pressed=true]{border-color:var(--brass,#d3a74d);box-shadow:inset 0 0 0 2px var(--brass,#d3a74d)}'+
'@media (min-width:900px) and (min-height:600px){.nl{zoom:1.2}}';
var wrap=null;
function ui(html){if(!document.getElementById('nl-css')){var st=document.createElement('style');st.id='nl-css';st.textContent=CSS;document.head.appendChild(st);}
  if(!wrap){wrap=document.createElement('div');wrap.className='nl-wrap';document.body.appendChild(wrap);}wrap.hidden=false;wrap.style.display='grid';
  wrap.innerHTML='<div class="nl">'+html+'</div>';return wrap.querySelector('.nl');}
function closeUI(){if(wrap){wrap.style.display='none';wrap.innerHTML='';}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var GN={janggi:'장기',baduk:'바둑',omok:'오목',othello:'오델로',alkkagi:'알까기',gostop:'고스톱',memory:'짝 맞추기'};
/* opts: {game, sizes:[2] or [2,3], describe(cfg,n)->text, makeCfg(n)->cfg}  → Promise<{room,seat,n,cfg,code,names}> */
function lobby(opts){return new Promise(function(resolve,reject){
  if(!configured){var el=ui('<h3>온라인 대전</h3><p>온라인 서버가 아직 연결되지 않았습니다. 프로그램 제작자에게 문의해 주세요.</p><button class="pri">닫기</button>');el.querySelector('button').onclick=function(){closeUI();reject(new Error('cancel'));};return;}
  if(!navigator.onLine){var e2=ui('<h3>온라인 대전</h3><p>인터넷에 연결되어 있지 않습니다. 와이파이나 데이터 연결을 확인해 주세요.</p><button class="pri">닫기</button>');e2.querySelector('button').onclick=function(){closeUI();reject(new Error('cancel'));};return;}
  var n=opts.sizes[0];
  function home(){var el=ui('<h3>'+GN[opts.game]+' 온라인 대전</h3><p>방을 만든 사람이 방 번호를 친구에게 알려 주면, 친구가 그 번호로 들어와 함께 둡니다.</p>'+
    '<label><p style="margin-bottom:6px">내 이름 (상대에게 보입니다)</p><input id="nl-name" maxlength="8" placeholder="예: 김영수" value="'+esc(myName())+'"></label>'+
    (opts.sizes.length>1?'<div class="opt">'+opts.sizes.map(function(k){return '<button data-n="'+k+'" aria-pressed="'+(k===n)+'">'+k+'명이서</button>';}).join('')+'</div>':'')+
    (opts.timeLimit&&window.TMR?'<div><p style="margin-bottom:6px">시간 제한 (한 수에 · 방을 만들 때 정합니다)</p><div id="nl-tl"></div></div>':'')+
    '<div class="row"><button class="pri" id="nl-make">방 만들기</button><button id="nl-join">방 들어가기</button></div><p style="font-size:14px" id="nl-desc">'+esc(opts.describe(opts.makeCfg(n),n))+'</p><button id="nl-x">닫기</button>');
    var tlBox=el.querySelector('#nl-tl');if(tlBox)TMR.seg(tlBox,opts.timeLimit.get(),function(v){opts.timeLimit.set(v);var d=el.querySelector('#nl-desc');if(d)d.textContent=opts.describe(opts.makeCfg(n),n);});
    el.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){n=+b.dataset.n;saveName();home();};});
    el.querySelector('#nl-make').onclick=function(){if(!saveName())return;make();};el.querySelector('#nl-join').onclick=function(){if(!saveName())return;join();};
    el.querySelector('#nl-x').onclick=function(){closeUI();reject(new Error('cancel'));};}
  function saveName(){var i=document.getElementById('nl-name');var v=(i&&i.value||'').trim();if(!v){i.focus();i.style.borderColor='#e8665a';return false;}lsSet('online.v1.name',v);return true;}
  function make(){var cfg=opts.makeCfg(n),tries=0;var el=ui('<h3>방 만드는 중…</h3><p>잠시만 기다려 주세요.</p>');
    (function attempt(){var code=String(1000+Math.floor(Math.random()*9000));tries++;
      req('GET','/'+code).then(function(r){if(r&&r.t&&Date.now()-r.t<6*3600e3&&!r.over&&tries<12)return attempt();
        var room={game:opts.game,n:n,cfg:cfg,t:Date.now(),seats:{0:{name:myName(),seen:TS,on:true}},over:false};
        return req('PUT','/'+code,room).then(function(){wait(code,0);});}).catch(function(){fail('서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.');});})();}
  function fail(msg){var el=ui('<h3>연결 실패</h3><p>'+msg+'</p><button class="pri">돌아가기</button>');el.querySelector('button').onclick=home;}
  function wait(code,seat){var R=new Room(code,seat,opts.game);
    var el=ui('<h3>상대를 기다리는 중</h3><p>'+(seat===0?'아래 방 번호를 친구에게 알려 주세요.':'다른 사람이 들어오기를 기다리는 중입니다.')+'</p><div class="code">'+code+'</div><div class="seats" id="nl-seats"></div><button id="nl-cancel">취소</button>');
    var done=false;
    R.on(function(t,d){if(t!=='room'||done)return;var s=d.seats||{},nn=d.n||2,h='',full=true;
      for(var i=0;i<nn;i++){var x=s[i];if(!x)full=false;h+='<div class="seat"><span>'+(i===0?'방장':'손님'+i)+(i===seat?' (나)':'')+'</span><b>'+(x?esc(x.name):'기다리는 중…')+'</b></div>';}
      var se=document.getElementById('nl-seats');if(se)se.innerHTML=h;
      if(full){done=true;lsSet('online.v1.'+opts.game,{code:code,seat:seat});setTimeout(function(){closeUI();resolve({room:R,seat:seat,n:nn,cfg:d.cfg,code:code,names:R.names()});},700);}});
    R.open();
    el.querySelector('#nl-cancel').onclick=function(){done=true;R.close();if(seat===0)req('DELETE','/'+code).catch(function(){});else req('DELETE','/'+code+'/seats/'+seat).catch(function(){});home();};}
  function join(){var el=ui('<h3>방 들어가기</h3><p>친구에게 받은 4자리 방 번호를 넣으세요.</p><input class="codein" id="nl-code" inputmode="numeric" maxlength="4" autocomplete="off"><div class="err" id="nl-err"></div>'+
      '<div class="pad">'+[1,2,3,4,5,6,7,8,9,'지움',0,'들어가기'].map(function(k){return '<button data-k="'+k+'"'+(k==='들어가기'?' class="pri" style="font-size:18px"':k==='지움'?' style="font-size:18px"':'')+'>'+k+'</button>';}).join('')+'</div><button id="nl-back">뒤로</button>');
    var inp=el.querySelector('#nl-code');inp.focus();
    el.querySelectorAll('[data-k]').forEach(function(b){b.onclick=function(){var k=b.dataset.k;if(k==='지움')inp.value=inp.value.slice(0,-1);else if(k==='들어가기')go();else if(inp.value.length<4)inp.value+=k;};});
    inp.onkeydown=function(e){if(e.key==='Enter')go();};
    el.querySelector('#nl-back').onclick=home;
    function go(){var code=inp.value.replace(/\D/g,'');var er=el.querySelector('#nl-err');if(code.length!==4){er.textContent='번호 4자리를 넣어 주세요';return;}er.textContent='찾는 중…';
      req('GET','/'+code).then(function(r){if(!r||!r.seats){er.textContent='그런 방이 없습니다. 번호를 다시 확인해 주세요.';return;}
        if(r.game!==opts.game){er.textContent='이 번호는 '+(GN[r.game]||'다른 게임')+' 방입니다. '+(GN[r.game]||'그 게임')+'에서 들어가 주세요.';return;}
        var nn=r.n||2,seat=-1;for(var i=1;i<nn;i++){if(!r.seats[i]){seat=i;break;}}
        if(seat<0){er.textContent='이미 사람이 다 찬 방입니다.';return;}
        return req('PUT','/'+code+'/seats/'+seat,{name:myName(),seen:TS,on:true}).then(function(){wait(code,seat);});}).catch(function(){er.textContent='서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.';});}}
  home();});}
/* rejoin a saved game: Promise<{room,seat,n,cfg,code,names}> or null */
function saved(game){return lsGet('online.v1.'+game,null);}
function rejoin(game){var s=saved(game);if(!s||!configured)return Promise.resolve(null);
  return req('GET','/'+s.code).then(function(r){if(!r||r.over||r.game!==game||!r.seats||!r.seats[s.seat]){lsSet('online.v1.'+game,null);return null;}
    var R=new Room(s.code,s.seat,game);return {room:R,seat:s.seat,n:r.n||2,cfg:r.cfg,code:s.code,names:null};}).catch(function(){return null;});}
function forget(game){lsSet('online.v1.'+game,null);}
return {configured:configured,lobby:lobby,rejoin:rejoin,saved:saved,forget:forget,closeUI:closeUI};
})();
</script>

function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

  if(name==='home')renderHome();if(name==='stats')renderStats();if(name==='setup')renderSetup();if(name==='game')requestAnimationFrame(layout);}

function modal(html,actions){const s=$('sheet');s.innerHTML=html+'<div class="row"></div>';const row=s.querySelector('.row');
  actions.forEach(a=>{const b=document.createElement('button');b.className='btn small '+(a.cls||'');b.textContent=a.label;b.onclick=()=>{$('modal').hidden=true;a.fn&&a.fn();};row.appendChild(b);});
  $('modal').hidden=false;}
/* sound: short clean tones through a limiter */
let actx=null,MASTER=null;
function AC(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null;}}
function master(){const a=AC();if(!a)return null;if(MASTER)return MASTER;const c=a.createDynamicsCompressor();c.threshold.value=-18;c.ratio.value=8;const g=a.createGain();g.gain.value=0.7;g.connect(c);c.connect(a.destination);return MASTER=g;}
function tone(f,t,dur,vol,type){const a=AC();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(master());o.start(t);o.stop(t+dur+0.05);}
function sfx(kind){if(!prefs.sound)return;const a=AC();if(!a)return;const t=a.currentTime+0.01;
  if(kind==='flip'){tone(1400,t,0.06,0.08,'sine');tone(900,t+0.03,0.07,0.06,'sine');}
  else if(kind==='match'){[659,880].forEach((f,i)=>tone(f,t+i*0.09,0.3,0.14));}
  else if(kind==='miss'){tone(330,t,0.18,0.07,'sine');}
  else if(kind==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,t+i*0.12,0.45,0.15));}
  else if(kind==='lose'){[523,440,392].forEach((f,i)=>tone(f,t+i*0.16,0.4,0.12,'sine'));}}

/* deck */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function faces(theme,n){let pool;
  if(theme==='hwatu')pool=HW.map((_,i)=>'h'+i);
  else if(theme==='mix')pool=[].concat(THEMES.fruit.items,THEMES.flower.items,THEMES.animal.items);
  else pool=THEMES[theme].items.slice();
  return shuffle(pool).slice(0,n);}
function faceHTML(f){return f[0]==='h'&&f.length<=3&&/^h\d+$/.test(f)?`<img src="${HW[+f.slice(1)]}" alt="" draggable="false">`:`<span class="emo">${f}</span>`;}

/* game state */
let G=null,busy=false,timerIv=null,aiT=null;
function newGame(cfg){const n=PAIRS[cfg.level-1],fs=faces(cfg.theme,n),deck=shuffle(fs.concat(fs));
  G={mode:cfg.mode,level:cfg.level,theme:cfg.theme,deck,up:deck.map(()=>0),found:deck.map(()=>-1),open:[],tries:0,flips:0,elapsed:0,started:0,
    turn:0,score:[0,0],mem:{},t:Date.now(),over:false};
  busy=false;persist();show('game');build();
  if(prefs.peek){busy=true;G.up=G.deck.map(()=>1);paint();setTimeout(()=>{if(!G)return;G.up=G.deck.map(()=>0);paint();busy=false;sfx('flip');next();},3000);toast('카드 자리를 잘 기억해 두세요',2800);}
  else next();}
function persist(){if(G&&G.mode==='online')return;if(!G||G.over){save(KEY.cur,null);return;}save(KEY.cur,Object.assign({},G,{open:[],up:G.found.map(f=>f>=0?1:0),elapsed:elapsedNow()}));}
function resume(){const s=load(KEY.cur,null);if(!s)return;G=Object.assign(s,{open:[],started:0,over:false});busy=false;show('game');build();next();}
function elapsedNow(){return G?G.elapsed+(G.started?(Date.now()-G.started)/1000:0):0;}
function startClock(){if(G.started)return;G.started=Date.now();clearInterval(timerIv);timerIv=setInterval(()=>{if(G&&!G.over&&!$('game').hidden)status();},500);}
function stopClock(){if(G&&G.started){G.elapsed=elapsedNow();G.started=0;}clearInterval(timerIv);}
const fmtT=s=>{s=Math.round(s);return (s>=60?Math.floor(s/60)+'분 ':'')+(s%60)+'초';};

function build(){const el=$('cards');el.className='cards '+(G.theme==='hwatu'?'hw':'em');
  el.innerHTML=G.deck.map((f,i)=>`<button class="card" data-i="${i}" aria-label="카드 ${i+1}"><span class="in"><span class="back"></span><span class="front">${faceHTML(f)}</span></span></button>`).join('');
  el.querySelectorAll('.card').forEach(c=>c.onclick=()=>localPick(+c.dataset.i));layout();paint();}
function layout(){if(!G||$('game').hidden)return;const wrap=$('wrap'),W=wrap.clientWidth,H=wrap.clientHeight,n=G.deck.length,asp=G.theme==='hwatu'?1.55:1.15,gap=Math.max(6,Math.min(14,W/90));
  let best={s:0,c:1};for(let c=1;c<=n;c++){const r=Math.ceil(n/c),w=Math.min((W-gap*(c-1))/c,(H-gap*(r-1))/r/asp);if(w>best.s)best={s:w,c};}
  const el=$('cards');el.style.gridTemplateColumns=`repeat(${best.c},${Math.floor(best.s)}px)`;el.style.gap=gap+'px';el.style.setProperty('--cw',Math.floor(best.s)+'px');el.style.setProperty('--ch',Math.floor(best.s*asp)+'px');}
window.addEventListener('resize',layout);
function paint(){if(!G)return;document.querySelectorAll('#cards .card').forEach((c,i)=>{const up=G.up[i]||G.found[i]>=0||G.open.includes(i);c.classList.toggle('up',!!up);
  c.classList.toggle('done',G.found[i]>=0);c.classList.toggle('me',G.found[i]===mySeat());c.classList.toggle('ai',G.found[i]>=0&&G.found[i]!==mySeat());});status();bars();}
function status(){if(!G)return;const left=G.found.filter(f=>f<0).length/2;
  $('g-status').textContent=G.mode==='solo'?`남은 짝 ${left} · ${G.tries}번 시도 · ${fmtT(elapsedNow())}`:`남은 짝 ${left} · ${G.over?'게임 끝':G.turn===mySeat()?'내 차례':(G.mode==='online'?'상대 차례':'컴퓨터 차례')}`;}
function bars(){if(!G)return;
  if(G.mode==='solo'){const best=bestOf(G.level);
    $('bar-a').innerHTML=`<span class="ico">⏱</span><div class="who"><b>${fmtT(elapsedNow())}</b><span>걸린 시간</span></div><div class="pts num"><b>${G.tries}</b>시도</div>`;
    $('bar-b').innerHTML=`<span class="ico">🏆</span><div class="who"><b>${best?fmtT(best.time):'기록 없음'}</b><span>${G.level}단계 최고 기록${best?' · '+best.tries+'번 시도':''}</span></div><div class="pts num"><b>${G.found.filter(f=>f>=0).length/2}</b>찾은 짝</div>`;
    $('bar-a').classList.add('turn');$('bar-b').classList.remove('turn');}
  else if(G.mode==='online'){const me=G.seat,op=1-me;$('bar-a').innerHTML=`<span class="ico">🙂</span><div class="who"><b>${oppName()}</b><span>${oppState()}${G.turn===op&&!G.over?' · 고르는 중':''}</span></div><div class="pts num"><b>${G.score[op]}</b>짝</div>`;
    $('bar-b').innerHTML=`<span class="ico">😀</span><div class="who"><b>나</b><span>${G.turn===me&&!G.over?'카드를 두 장 고르세요':'기다리는 중'}</span></div><div class="pts num"><b>${G.score[me]}</b>짝</div>`;
    $('bar-a').classList.toggle('turn',G.turn===op&&!G.over);$('bar-b').classList.toggle('turn',G.turn===me&&!G.over);}
  else{$('bar-a').innerHTML=`<span class="ico">🤖</span><div class="who"><b>컴퓨터${G.turn===1&&!G.over?' <span class="thinking">고르는 중…</span>':''}</b><span>${kyu(G.level)}</span></div><div class="pts num"><b>${G.score[1]}</b>짝</div>`;
    $('bar-b').innerHTML=`<span class="ico">🙂</span><div class="who"><b>나</b><span>${G.turn===0&&!G.over?'카드를 두 장 고르세요':'기다리는 중'}</span></div><div class="pts num"><b>${G.score[0]}</b>짝</div>`;
    $('bar-a').classList.toggle('turn',G.turn===1&&!G.over);$('bar-b').classList.toggle('turn',G.turn===0&&!G.over);}
  $('g-sound').textContent=prefs.sound?'소리 켬':'소리 끔';}
function remember(i){if(G.mode!=='vs')return;const p=0.3+0.07*G.level;if(Math.random()<p)G.mem[i]=G.deck[i];}
function pick(i,who,remote){if(!G||G.over||busy)return false;if(G.mode!=='solo'&&G.turn!==who)return false;
  if(G.found[i]>=0||G.open.includes(i))return false;startClock();if(G.mode==='online'&&!remote)ON.send({i});
  G.open.push(i);G.flips++;sfx('flip');remember(i);paint();
  if(G.open.length<2)return true;
  const [a,b]=G.open;G.tries++;busy=true;
  if(G.deck[a]===G.deck[b]){setTimeout(()=>{G.found[a]=G.found[b]=G.mode!=='solo'?G.turn:0;G.open=[];delete G.mem[a];delete G.mem[b];if(G.mode!=='solo')G.score[G.turn]++;sfx('match');busy=false;paint();persist();
      if(G.found.every(f=>f>=0))return finish();next();},380);}
  else{setTimeout(()=>{sfx('miss');},350);setTimeout(()=>{G.open=[];busy=false;if(G.mode!=='solo')G.turn=1-G.turn;paint();persist();next();},1100);}return true;}
function next(){if(!G||G.over)return;paint();if(G.mode==='vs'&&G.turn===1){clearTimeout(aiT);aiT=setTimeout(aiMove,900);}}
function aiMove(){if(!G||G.over||G.turn!==1||busy||$('game').hidden)return;
  const hidden=G.deck.map((_,i)=>i).filter(i=>G.found[i]<0),known=hidden.filter(i=>G.mem[i]!=null),unknown=hidden.filter(i=>G.mem[i]==null);
  let pair=null;for(const x of known)for(const y of known)if(x<y&&G.mem[x]===G.mem[y]){pair=[x,y];break;}

    title=w===0?'승리':w===1?'패배':'무승부';if(w===1)color='var(--red)';sfx(w===1?'lose':'win');

function bestOf(l){const rs=records.filter(r=>r.mode==='solo'&&r.level===l);if(!rs.length)return null;return rs.reduce((a,b)=>b.time<a.time||(b.time===a.time&&b.tries<a.tries)?b:a);}

  if(cur&&cur.deck){rb.hidden=false;rb.innerHTML=`<span class="ico">續</span><span class="t">이어하기<small>${cur.mode==='solo'?'혼자 하기':'컴퓨터와 대결'} · ${cur.level}단계 · 남은 짝 ${cur.found.filter(f=>f<0).length/2}</small></span>`;}else rb.hidden=true;}
$('btn-resume').onclick=resume;$('btn-online').onclick=goOnline;$('btn-oresume').onclick=()=>NET.rejoin('memory').then(r=>r?startOnline(r):(toast('이어할 온라인 게임이 없습니다'),renderHome()));

  if(prefs.mode==='solo'){const b=bestOf(l);$('lv-rec').textContent=b?`이 단계 최고 기록 ${fmtT(b.time)} · ${b.tries}번 시도`:'이 단계에서 아직 완성한 기록이 없습니다.';}

function fmtDate(t){const d=new Date(t);return `${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}

$('st-reset').onclick=()=>modal('<h3>기록 초기화</h3><p>짝 맞추기 기록을 모두 지웁니다. 되돌릴 수 없습니다.</p>',[{label:'취소'},{label:'모두 지우기',cls:'primary',fn:()=>{records=[];save(KEY.rec,records);renderStats();toast('기록을 지웠습니다');}}]);
let ON=null,OPP=[true,true],ONAMES=['',''];

function localPick(i){if(G&&G.mode==='online'){if(G.turn!==G.seat){if(!busy)toast('상대 차례입니다');return;}pick(i,G.seat);}else pick(i,0);}
function remotePick(i,s){if(!G||G.over)return;if(busy){setTimeout(()=>remotePick(i,s),150);return;}pick(i,s,true);}
function goOnline(){NET.lobby({game:'memory',sizes:[2],makeCfg:()=>{const n=PAIRS[prefs.level-1],fs=faces(prefs.theme,n);return {level:prefs.level,theme:prefs.theme,deck:shuffle(fs.concat(fs))};},
  describe:c=>`${c.level}단계 (카드 ${c.deck.length}장) · ${THEMES[c.theme].name} (혼자 하기 설정에서 바꿀 수 있습니다) · 방장이 먼저 뒤집습니다`}).then(startOnline).catch(()=>{});}
/* 한 판 더: 두 사람 모두 같은 시드로 카드를 섞어 같은 배치를 만듭니다 */

function seedShuffle(a,seed){let x=(seed||1)>>>0;const r=()=>{x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;return x/4294967296;};for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
